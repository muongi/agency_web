<title>SUNU Premium Collection Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<style>
:root{
  --paper:#FAFAF7; --surface:#FFFFFF; --surface-2:#F1F3EF; --surface-3:#E7EAE5;
  --ink:#16191A; --ink-2:#454B4C; --ink-3:#6E7678;
  --rule:#DCDFD9; --rule-strong:#C3C8C1;
  --accent:#0B4F55; --accent-2:#12777F; --accent-soft:#E1EDEC; --accent-ink:#08383D;
  --ok:#1E6E4A; --ok-soft:#E0F0E7;
  --warn:#8F5406; --warn-soft:#F7EBD9;
  --crit:#9E2A20; --crit-soft:#F8E5E2;
  --shadow:0 1px 2px rgba(20,30,30,.06),0 8px 24px -12px rgba(20,30,30,.18);
  --measure:66ch;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1315; --surface:#161B1D; --surface-2:#1D2426; --surface-3:#252D30;
    --ink:#E9EEED; --ink-2:#B2BCBB; --ink-3:#7E8A89;
    --rule:#2A3335; --rule-strong:#3A4548;
    --accent:#4FC7BC; --accent-2:#69D8CD; --accent-soft:#14302F; --accent-ink:#93E2DA;
    --ok:#5FC28C; --ok-soft:#12291F;
    --warn:#DFA24B; --warn-soft:#2C2214;
    --crit:#E9796B; --crit-soft:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1315; --surface:#161B1D; --surface-2:#1D2426; --surface-3:#252D30;
  --ink:#E9EEED; --ink-2:#B2BCBB; --ink-3:#7E8A89;
  --rule:#2A3335; --rule-strong:#3A4548;
  --accent:#4FC7BC; --accent-2:#69D8CD; --accent-soft:#14302F; --accent-ink:#93E2DA;
  --ok:#5FC28C; --ok-soft:#12291F;
  --warn:#DFA24B; --warn-soft:#2C2214;
  --crit:#E9796B; --crit-soft:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.62;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.ui{font-family:var(--f-display)}
h1,h2,h3,h4{text-wrap:balance; line-height:1.18; margin:0}

/* ---------- header ---------- */
.masthead{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--rule);
}
.masthead-in{max-width:1080px; margin:0 auto; padding:.7rem 1rem .55rem}
.eyebrow{
  font-family:var(--f-display); font-size:.66rem; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
  display:flex; align-items:center; gap:.5rem; flex-wrap:wrap;
}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
.masthead h1{font-size:1.18rem; font-weight:800; letter-spacing:-.018em; margin-top:.18rem}
.masthead h1 .thin{font-weight:400; color:var(--ink-2)}

.langsw{display:inline-flex; border:1px solid var(--rule); border-radius:7px; overflow:hidden; margin-left:auto}
.langsw button{
  appearance:none; background:var(--surface-2); border:0; cursor:pointer;
  font-family:var(--f-display); font-size:.68rem; font-weight:700; letter-spacing:.06em;
  color:var(--ink-3); padding:.28rem .55rem;
}
.langsw button[aria-pressed="true"]{background:var(--accent); color:var(--surface)}
:root[data-theme="dark"] .langsw button[aria-pressed="true"]{color:var(--paper)}
.langsw button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.eyebrow-row{display:flex; align-items:center; gap:.5rem}
.counters{display:flex; gap:.4rem; margin-top:.6rem; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.counters::-webkit-scrollbar{display:none}
.ctr{
  flex:none; border:1px solid var(--rule); border-radius:7px; background:var(--surface-2);
  padding:.34rem .55rem; min-width:112px;
}
.ctr .lbl{font-family:var(--f-display); font-size:.6rem; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); display:block; white-space:nowrap}
.ctr .val{font-family:var(--f-mono); font-size:.94rem; font-weight:600; color:var(--ink); display:block; line-height:1.35}
.ctr.is-near{border-color:var(--warn); background:var(--warn-soft)}
.ctr.is-near .val{color:var(--warn)}
.ctr.is-past{opacity:.55}

/* ---------- tabs ---------- */
.tabs{
  position:sticky; top:0; z-index:39; background:var(--paper);
  border-bottom:1px solid var(--rule); overflow-x:auto; scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{max-width:1080px; margin:0 auto; display:flex; gap:.15rem; padding:0 .5rem}
.tab{
  flex:none; appearance:none; background:none; border:0; cursor:pointer;
  font-family:var(--f-display); font-size:.8rem; font-weight:600; color:var(--ink-3);
  padding:.72rem .6rem .6rem; border-bottom:2px solid transparent; white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:3px}

main{max-width:1080px; margin:0 auto; padding:1.1rem 1rem 4rem}
.panel[hidden]{display:none!important}

/* ---------- status view ---------- */
.lede{font-size:1.02rem; color:var(--ink-2); max-width:var(--measure); margin:0 0 1.4rem}
.lede strong{color:var(--ink); font-weight:600}

.sec{margin:0 0 2rem}
.sec-head{display:flex; align-items:baseline; gap:.55rem; margin-bottom:.7rem; flex-wrap:wrap}
.sec-head h2{font-size:1.02rem; font-weight:800; letter-spacing:-.01em}
.sec-head .note{font-family:var(--f-display); font-size:.72rem; color:var(--ink-3)}

/* milestone rail */
.rail{list-style:none; margin:0; padding:0; position:relative}
.rail::before{content:""; position:absolute; left:11px; top:14px; bottom:14px; width:1px; background:var(--rule)}
.ms{position:relative; padding:0 0 .95rem 2.1rem}
.ms:last-child{padding-bottom:0}
.ms .pip{
  position:absolute; left:4px; top:4px; width:15px; height:15px; border-radius:50%;
  background:var(--surface); border:2px solid var(--rule-strong);
}
.ms.done .pip{background:var(--ok); border-color:var(--ok)}
.ms.now .pip{background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
.ms.hard .pip{border-color:var(--crit); border-width:3px}
.ms-top{display:flex; align-items:baseline; gap:.5rem; flex-wrap:wrap}
.ms-id{font-family:var(--f-mono); font-size:.74rem; font-weight:600; color:var(--ink-3)}
.ms-date{font-family:var(--f-mono); font-size:.74rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.ms-title{font-family:var(--f-display); font-weight:600; font-size:.95rem; display:block; margin-top:.1rem}
.ms.hard .ms-title{color:var(--crit)}
.ms-note{font-size:.88rem; color:var(--ink-3); display:block; margin-top:.1rem}

/* chips */
.chip{
  display:inline-flex; align-items:center; gap:.3rem; font-family:var(--f-display);
  font-size:.62rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
  padding:.13rem .42rem; border-radius:4px; border:1px solid;
  background:var(--surface-2); border-color:var(--rule); color:var(--ink-3);
}
.chip.ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.chip.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.chip.crit{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
.chip.acc{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* cards + checklists */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:9px;
  padding:.85rem .9rem; box-shadow:var(--shadow); margin-bottom:.7rem;
}
.card-head{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem}
.card-head h3{font-size:.9rem; font-weight:700}
.card-head .when{font-family:var(--f-mono); font-size:.72rem; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.05rem}
.checks li{display:flex; gap:.55rem; align-items:flex-start; padding:.28rem 0; border-top:1px solid var(--rule)}
.checks li:first-child{border-top:0}
.checks input{
  appearance:none; flex:none; width:17px; height:17px; margin-top:.24rem; border-radius:4px;
  border:1.5px solid var(--rule-strong); background:var(--surface-2); cursor:pointer; position:relative;
}
.checks input:checked{background:var(--accent); border-color:var(--accent)}
.checks input:checked::after{
  content:""; position:absolute; left:5px; top:1px; width:4px; height:9px;
  border:solid var(--surface); border-width:0 2px 2px 0; transform:rotate(42deg);
}
:root[data-theme="dark"] .checks input:checked::after,
.checks input:checked::after{border-color:var(--paper)}
.checks input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.checks label{font-size:.9rem; color:var(--ink-2); cursor:pointer; line-height:1.45}
.checks input:checked + label{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--rule-strong)}

/* data tables */
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.85rem; font-family:var(--f-display)}
th,td{text-align:left; padding:.42rem .55rem; border-bottom:1px solid var(--rule); vertical-align:top}
th{
  font-size:.63rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); border-bottom:1px solid var(--rule-strong); white-space:nowrap;
}
td.mono,.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}

/* ---------- rendered documents ---------- */
.doc-nav{
  background:var(--surface); border:1px solid var(--rule); border-radius:9px;
  margin-bottom:1.3rem; overflow:hidden;
}
.doc-nav summary{
  cursor:pointer; padding:.6rem .85rem; font-family:var(--f-display); font-weight:600;
  font-size:.82rem; color:var(--ink-2); list-style:none; display:flex; align-items:center; gap:.5rem;
}
.doc-nav summary::-webkit-details-marker{display:none}
.doc-nav summary::before{content:"▸"; color:var(--accent); font-size:.7rem; transition:transform .15s}
.doc-nav[open] summary::before{transform:rotate(90deg)}
.doc-nav ol{margin:0; padding:0 .85rem .7rem 2.2rem; font-family:var(--f-display); font-size:.82rem}
.doc-nav li{margin:.2rem 0}
.doc-nav li.sub{list-style:none; margin-left:-.9rem; font-size:.78rem}
.doc-nav a{color:var(--ink-2); text-decoration:none}
.doc-nav a:hover{color:var(--accent); text-decoration:underline}

.prose{max-width:var(--measure)}
.prose > table,.prose .scroll-x{max-width:100%}
.prose h1{font-size:1.42rem; font-weight:800; letter-spacing:-.02em; margin:0 0 .2rem}
.prose h2{
  font-size:1.08rem; font-weight:800; margin:2.2rem 0 .55rem; padding-top:.8rem;
  border-top:1px solid var(--rule); letter-spacing:-.012em; scroll-margin-top:100px;
}
.prose h3{font-size:.96rem; font-weight:700; color:var(--accent); margin:1.5rem 0 .4rem; scroll-margin-top:100px}
.prose h4{font-size:.88rem; font-weight:700; margin:1.1rem 0 .3rem; color:var(--ink-2)}
.prose p{margin:0 0 .85rem}
.prose ul,.prose ol{margin:0 0 .9rem; padding-left:1.25rem}
.prose li{margin:.22rem 0}
.prose li::marker{color:var(--ink-3)}
.prose strong{font-weight:600; color:var(--ink)}
.prose a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px}
.prose hr{border:0; border-top:1px solid var(--rule); margin:2rem 0}
.prose blockquote{
  margin:1rem 0; padding:.7rem .9rem; background:var(--warn-soft);
  border-left:3px solid var(--warn); border-radius:0 6px 6px 0; font-size:.94rem;
}
.prose blockquote p:last-child{margin-bottom:0}
.prose code{
  font-family:var(--f-mono); font-size:.85em; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:4px; padding:.05em .32em;
}
.prose pre{
  font-family:var(--f-mono); font-size:.72rem; line-height:1.5; background:var(--surface-2);
  border:1px solid var(--rule); border-radius:8px; padding:.8rem .9rem; margin:1rem 0;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.prose pre code{background:none; border:0; padding:0; font-size:inherit}
.prose .scroll-x{margin:1rem 0; border:1px solid var(--rule); border-radius:8px; background:var(--surface)}
.prose .scroll-x table{font-size:.8rem}
.prose .scroll-x th,.prose .scroll-x td{padding:.45rem .6rem}
.prose .scroll-x tr:last-child td{border-bottom:0}
.prose .scroll-x th:first-child,.prose .scroll-x td:first-child{padding-left:.8rem}
.prose figure{margin:1.4rem 0; padding:0}
.prose figure svg{display:block; width:100%; height:auto; color:var(--ink-2)}
.prose figure .fig-frame{
  border:1px solid var(--rule); border-radius:9px; background:var(--surface);
  padding:.7rem; overflow-x:auto;
}
.prose figcaption{
  margin-top:.5rem; padding-top:.5rem; border-top:1px solid var(--rule);
  font-family:var(--f-display); font-size:.76rem; line-height:1.5; color:var(--ink-3);
}
.doc-meta{
  font-family:var(--f-display); font-size:.74rem; color:var(--ink-3);
  border-bottom:1px solid var(--rule); padding-bottom:.7rem; margin-bottom:1.2rem;
}

footer{
  max-width:1080px; margin:0 auto; padding:1.2rem 1rem 2.5rem;
  border-top:1px solid var(--rule); font-family:var(--f-display);
  font-size:.74rem; color:var(--ink-3); display:flex; gap:.8rem; flex-wrap:wrap; align-items:center;
}
.totop{
  margin-left:auto; appearance:none; background:var(--surface-2); border:1px solid var(--rule);
  border-radius:6px; padding:.3rem .6rem; font-family:inherit; font-size:.72rem;
  font-weight:600; color:var(--ink-2); cursor:pointer;
}
.totop:hover{border-color:var(--accent); color:var(--accent)}

@media (min-width:760px){
  body{font-size:17.5px}
  .masthead-in{padding:1rem 1.5rem .7rem}
  .masthead h1{font-size:1.5rem}
  .tabs-in,main,footer{padding-left:1.5rem; padding-right:1.5rem}
  main{padding-top:1.6rem}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:.7rem}
  .grid-2 .card{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

/* ---------- status view (rebuilt on language change) ---------- */
function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html; return e}

function section(key,L){
  var s=el("div","sec");
  var h=el("div","sec-head");
  h.appendChild(el("h2",null,L.heads[key][0]));
  if(L.heads[key][1]) h.appendChild(el("span","note",L.heads[key][1]));
  s.appendChild(h);
  return s;
}

function dataTable(headers,rows){
  var card=el("div","card"); card.style.padding="0"; card.style.overflow="hidden";
  var wrap=el("div","scroll-x"); var t=document.createElement("table");
  var thead=document.createElement("thead"); var tr=document.createElement("tr");
  headers.forEach(function(h){var th=document.createElement("th"); th.textContent=h; tr.appendChild(th)});
  thead.appendChild(tr); t.appendChild(thead);
  var tb=document.createElement("tbody");
  rows.forEach(function(cells){
    var r=document.createElement("tr");
    cells.forEach(function(c){var td=document.createElement("td");
      if(c && c.html!==undefined){td.innerHTML=c.html; if(c.cls)td.className=c.cls}
      else {td.textContent=c===null?"":c}
      r.appendChild(td)});
    tb.appendChild(r)});
  t.appendChild(tb); wrap.appendChild(t); card.appendChild(wrap);
  return card;
}

function buildStatus(lg){
  var L=DATA[lg], root=document.getElementById("panel-status");
  root.innerHTML="";
  function fmt(t){return t.toLocaleDateString(L.loc,{day:"2-digit",month:"short"})}

  /* countdown strip lives in the masthead */
  var cEl=document.getElementById("counters"); cEl.innerHTML="";
  L.counters.forEach(function(c){
    var t=d(c[1]), n=daysTo(t), cls="ctr";
    if(n<0)cls+=" is-past"; else if(n<=14)cls+=" is-near";
    var v = n<0 ? L.past : (n===0 ? L.today : n+" "+(n===1?L.day:L.days));
    cEl.appendChild(el("div",cls,'<span class="lbl">'+c[0]+' · '+fmt(t)+
      '</span><span class="val">'+v+'</span>'));
  });

  root.appendChild(el("p","lede",L.lede));

  /* milestones */
  var s=section("ms",L), rail=el("ol","rail");
  L.ms.forEach(function(m){
    var li=el("li","ms"+(m[4]==="done"?" done":"")+(m[4]==="next"?" now":"")+(m[4]==="hard"?" hard":""));
    var chip = m[4]==="done" ? '<span class="chip ok">'+L.chip.done+'</span>'
             : m[4]==="next" ? '<span class="chip acc">'+L.chip.next+'</span>'
             : m[4]==="hard" ? '<span class="chip crit">'+L.chip.hard+'</span>' : "";
    li.innerHTML='<span class="pip"></span><div class="ms-top"><span class="ms-id">'+m[0]+
      '</span><span class="ms-date">'+m[1]+'</span>'+chip+
      '</div><span class="ms-title">'+m[2]+'</span><span class="ms-note">'+m[3]+'</span>';
    rail.appendChild(li);
  });
  s.appendChild(rail); root.appendChild(s);

  /* gates — the checkboxes keep index-based keys so ticks survive a language switch */
  s=section("gates",L);
  L.gates.forEach(function(g,gi){
    var c=el("div","card");
    var h='<div class="card-head"><span class="chip acc">'+g[0]+'</span><h3>'+g[2]+
          '</h3><span class="when">'+g[1]+'</span></div><ul class="checks">';
    g[3].forEach(function(it,i){
      var k=g[0]+":"+i, on=checks[k]?" checked":"";
      h+='<li><input type="checkbox" id="'+k+'" data-k="'+k+'"'+on+'><label for="'+k+'">'+it+'</label></li>';
    });
    c.innerHTML=h+"</ul>"; s.appendChild(c);
  });
  root.appendChild(s);

  /* dependencies */
  s=section("deps",L);
  s.appendChild(dataTable(L.th.deps, L.deps.map(function(r){
    var n=daysTo(d(r[2])), cls = n<0?"crit":(n<=7?"warn":"");
    return [{html:r[0],cls:"mono"}, r[1],
            {html:'<span class="chip '+cls+'">'+fmt(d(r[2]))+'</span>',cls:"mono"},
            r[3], {html:'<span style="color:var(--ink-3)">'+r[4]+'</span>'}];
  })));
  root.appendChild(s);

  /* open points */
  s=section("ops",L);
  s.appendChild(dataTable(L.th.ops, L.ops.map(function(r){
    return [{html:r[0],cls:"mono"}, r[1], {html:r[2],cls:"mono"},
            {html:'<span style="color:var(--ink-3)">'+r[3]+'</span>'}];
  })));
  root.appendChild(s);

  /* risks */
  s=section("risks",L);
  L.risks.forEach(function(r){
    var hi = r[2]==="high"||r[2]==="élevé";
    s.appendChild(el("div","card",
      '<div class="card-head"><span class="chip '+(hi?"crit":"warn")+'">'+r[2]+'</span>'+
      '<h3>'+r[1]+'</h3><span class="when">'+r[0]+' · '+r[4]+'</span></div>'+
      '<p style="margin:0;font-size:.9rem;color:var(--ink-2)">'+r[3]+'</p>'));
  });
  root.appendChild(s);

  /* hardening */
  s=section("hard",L);
  L.harden.forEach(function(h){
    var blocking=h[2]==="blocking";
    s.appendChild(el("div","card",
      '<div class="card-head"><span class="chip '+(blocking?"crit":"")+'">'+h[0]+'</span>'+
      '<h3>'+h[1]+'</h3><span class="when">'+(blocking?L.chip.blocking.toUpperCase()+" · ":"")+h[4]+'</span></div>'+
      '<p style="margin:0;font-size:.9rem;color:var(--ink-2)">'+h[3]+'</p>'));
  });
  root.appendChild(s);

  /* deliverables */
  s=section("del",L);
  s.appendChild(dataTable(L.th.del, L.delivs.map(function(r){
    var st = r[3]==="done" ? '<span class="chip ok">'+L.chip.delivered+'</span>'
                           : '<span class="chip">'+L.chip.pending+'</span>';
    return [{html:r[0],cls:"mono"}, r[1], {html:r[2],cls:"mono"}, {html:st}];
  })));
  root.appendChild(s);

  document.getElementById("totop").textContent=L.totop;
  document.getElementById("footnote").textContent=L.foot;
}

/* ---------- checkbox persistence ---------- */
document.addEventListener("change",function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-k");
  if(!k)return;
  if(e.target.checked)checks[k]=1; else delete checks[k];
  saveChecks(checks);
});

var TAB_LABEL={
 en:["Status","1 · Architecture","2 · Security","3 · User Guide","4 · Plan"],
 fr:["Suivi","1 · Architecture","2 · S\u00e9curit\u00e9","3 · Guide","4 · Plan"]
};

var LANGKEY="sunu-tpe-lang";
var lang="en";
try{var st=localStorage.getItem(LANGKEY); if(st==="fr"||st==="en")lang=st}catch(e){}
var rendered={};

function renderDoc(n,lg){
  var key="doc"+n+"-"+lg;
  if(rendered[key])return;
  var src=document.getElementById("src-"+key);
  if(!src)return;
  var panel=document.getElementById("panel-doc"+n);
  panel.innerHTML="";

  var meta=document.createElement("div");
  meta.className="doc-meta"; meta.textContent=META[lg][n-1].meta;

  var nav=document.createElement("details"); nav.className="doc-nav";
  nav.innerHTML='<summary>'+TOC_LABEL[lg]+'</summary><ol></ol>';

  var body=document.createElement("div"); body.className="prose";
  body.innerHTML=marked.parse(src.textContent);

  /* wide content scrolls inside its own box so the page never scrolls sideways */
  Array.prototype.forEach.call(body.querySelectorAll("table"),function(t){
    var w=document.createElement("div"); w.className="scroll-x";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  var ol=nav.querySelector("ol"), i=0;
  Array.prototype.forEach.call(body.querySelectorAll("h2,h3"),function(h){
    var id="d"+n+lg+"-h"+(i++); h.id=id;
    var li=document.createElement("li");
    if(h.tagName==="H3")li.className="sub";
    li.innerHTML='<a href="#'+id+'">'+h.textContent+"</a>";
    ol.appendChild(li);
  });

  panel.appendChild(meta); panel.appendChild(nav); panel.appendChild(body);
  rendered[key]=true;
}

function setLang(lg){
  lang=lg;
  try{localStorage.setItem(LANGKEY,lg)}catch(e){}
  document.getElementById("lang-en").setAttribute("aria-pressed",lg==="en"?"true":"false");
  document.getElementById("lang-fr").setAttribute("aria-pressed",lg==="fr"?"true":"false");
  document.documentElement.lang=lg;

  buildStatus(lg);

  rendered={};
  for(var n=1;n<=4;n++){
    document.getElementById("panel-doc"+n).innerHTML="";
    document.getElementById("tab-doc"+n).textContent=TAB_LABEL[lg][n];
  }
  document.getElementById("tab-status").textContent=TAB_LABEL[lg][0];

  var open=document.querySelector('.tab[aria-selected="true"]');
  if(open && /^tab-doc(\d)$/.test(open.id)) renderDoc(+RegExp.$1,lg);
}

document.getElementById("lang-en").addEventListener("click",function(){setLang("en")});
document.getElementById("lang-fr").addEventListener("click",function(){setLang("fr")});

/* ---------- tabs ---------- */
var tabs=Array.prototype.slice.call(document.querySelectorAll(".tab"));
function show(id){
  tabs.forEach(function(t){
    var on=t.id===id;
    t.setAttribute("aria-selected",on?"true":"false");
    document.getElementById(t.getAttribute("aria-controls")).hidden=!on;
  });
  window.scrollTo(0,0);
}
tabs.forEach(function(t){t.addEventListener("click",function(){
  if(/^tab-doc(\d)$/.test(t.id)) renderDoc(+RegExp.$1, lang);
  show(t.id);
})});
document.getElementById("totop").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});

setLang(lang);
})();
</script>
