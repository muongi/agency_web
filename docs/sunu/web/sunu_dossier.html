## 3. Modèle de menaces

### 3.1 Acteurs de menace

| Acteur | Motivation | Capacité | Priorité |
|---|---|---|---|
| **T1 — Collecteur malhonnête** | Détourner des primes encaissées, émettre de faux reçus, sous-déclarer | Justificatifs légitimes, possession physique du terminal, autonomie sur le terrain | **La plus élevée** |
| **T2 — Voleur** | Revendre un terminal ou une carte volés, en faire un usage frauduleux | Accès physique uniquement | Élevée |
| **T3 — Assuré agissant frauduleusement** | Obtenir un reçu sans payer, revendiquer un paiement non effectué, réutiliser un QR | Interaction avec le collecteur | Élevée |
| **T4 — Attaquant externe** | Voler la base de données personnelles, extorquer, perturber | Accès Internet, outillage courant | Élevée |
| **T5 — Utilisateur back-office interne malhonnête** | Confirmer un faux versement, altérer un encaissement, exfiltrer des données | Accès applicatif privilégié | Élevée |
| **T6 — Interception sur le réseau mobile** | Capter le trafic entre le terminal et la plateforme | Position réseau, Wi-Fi public | Moyenne |
| **T7 — Tiers compromis** (agrégateur, opérateur SMS, hébergeur) | Accéder aux données en transit ou au repos | Accès d'intégration légitime | Moyenne |

### 3.2 Principaux scénarios de menace et contre-mesures

| # | Scénario | Contre-mesures |
|---|---|---|
| **TH-1** | Le collecteur encaisse une prime et la garde, sans imprimer de reçu | Le reçu est produit par le système, non par le collecteur ; numérotation séquentielle des reçus par terminal avec détection des ruptures ; confirmation SMS à l'assuré (§8.4) ; sensibilisation de l'assuré au fait qu'un paiement sans reçu imprimé n'est pas valable ; encaissements rapprochés du plafond et des versements du collecteur |
| **TH-2** | Le collecteur imprime un reçu puis annule ou supprime l'enregistrement | Les encaissements sont en **ajout seul** ; aucune suppression sur l'appareil ni au back-office ; une correction est une écriture d'extourne nouvelle, soumise à habilitation et auditée ; la file locale du terminal n'est pas accessible à l'utilisateur |
| **TH-3** | Le collecteur accumule des espèces et disparaît | Le plafond par collecteur (Doc 1 §6.3) borne l'exposition maximale ; le terminal bloque les nouveaux encaissements au plafond ; suivi quotidien des soldes non versés ; alerte d'ancienneté sur les collecteurs au-dessus du seuil depuis plus de N jours |
| **TH-4** | Le collecteur déclare un versement supérieur au dépôt réel | Le versement est une *déclaration* ; seule la confirmation back-office face au relevé bancaire ou au comptage en caisse réduit le solde ; écart consigné ; confirmation à deux personnes au-delà d'un montant paramétrable |
| **TH-5** | Terminal volé | Appareil verrouillé par les justificatifs de l'agent et l'expiration sur inactivité ; aucune espèce sur l'appareil ; données locales chiffrées et cloisonnées à cet agent ; désactivation à distance du compte agent et du terminal depuis le back-office ; encaissements non synchronisés récupérables au retour |
| **TH-6** | Carte volée ou clonée | La carte porte un identifiant, **jamais de monnaie ni de solde** ; une carte identifie, elle n'autorise pas un paiement — c'est la session authentifiée du collecteur qui le fait ; blocage instantané au back-office ; recommandation du sans contact avec clés par carte plutôt que de la piste magnétique clonable (Doc 1 §7.2) |
| **TH-7** | QR de carte virtuelle contrefait ou rejoué | Signature cryptographique vérifiée hors ligne sur le terminal ; expiration du justificatif ; liste de révocation synchronisée vers les terminaux ; le QR identifie mais n'autorise pas ; présenter un QR produit malgré tout un reçu au nom du véritable assuré, si bien que le rejeu n'apporte aucun gain financier |
| **TH-8** | Interception du trafic TPE ↔ plateforme | TLS 1.2+ obligatoire ; épinglage de certificat dans l'application TPE ; aucune donnée sensible dans les URL ; refus du HTTP en clair |
| **TH-9** | Vol de la base de données personnelles | Chiffrement au repos ; base non exposée sur Internet ; comptes de base au moindre privilège ; sauvegardes chiffrées ; journalisation des accès ; alerte sur les volumes d'export anormaux |
| **TH-10** | Compromission d'une clé d'API | Clés par unité d'exploitation, hachées au repos, révocables instantanément, limitées en débit, usage journalisé avec horodatage de dernière utilisation ; procédure de rotation (§5.4) |
| **TH-11** | Un utilisateur back-office exporte tout le portefeuille clients | L'export est soumis à habilitation ; chaque export est journalisé avec l'acteur, les filtres et le nombre de lignes ; alerte volumétrique ; exports marqués au nom du demandeur |
| **TH-12** | Injection / XSS / CSRF sur le back-office | Requêtes paramétrées au niveau du framework, échappement en sortie, jetons CSRF sur toutes les requêtes web modifiant l'état, validation stricte côté serveur sur chaque point d'entrée |
| **TH-13** | Force brute sur les justificatifs de collecteur ou d'utilisateur | Limitation de débit et verrouillage progressif, protection contre le bourrage d'identifiants, absence d'énumération des comptes dans les messages d'erreur, alerte en cas d'échecs répétés |
| **TH-14** | Injection de données SUNULIFE malveillantes ou erronées corrompant les polices | Validation stricte du schéma à l'ingestion ; une synchronisation ne supprime jamais un encaissement local ; les anomalies sont mises en quarantaine plutôt qu'appliquées |

## 5. Gestion des identités et des accès

### 5.1 Utilisateurs back-office

| Contrôle | Mise en œuvre |
|---|---|
| Authentification | Identifiant/courriel + mot de passe sur HTTPS |
| Stockage des mots de passe | bcrypt avec sel par mot de passe ; jamais réversible, jamais journalisé |
| Politique de mot de passe | 12 caractères minimum, trois classes de caractères, blocage sur liste de mots de passe courants, pas de réutilisation des 5 derniers, expiration paramétrable (90 jours par défaut pour les profils privilégiés) |
| Première connexion | Changement de mot de passe imposé |
| Tentatives échouées | Temporisation progressive puis verrouillage temporaire ; alerte à l'administrateur |
| **Authentification multifacteur** | **Obligatoire pour les profils Administrateur et DSI** ; application TOTP ou code SMS. Voir §12 point H-5 |
| Session | Expiration sur inactivité (15 min par défaut pour les profils privilégiés, 30 min sinon) ; durée de vie absolue ; session régénérée à la connexion ; cookies secure, HttpOnly, SameSite |
| Désactivation | Immédiate au départ ; les comptes sont désactivés, jamais supprimés, afin de préserver la piste d'audit |
| Revue | Revue trimestrielle des comptes et habilitations par SUNU (§14.2) |

### 5.2 Contrôle d'accès fondé sur les rôles

La plateforme met en œuvre des habilitations granulaires regroupées en rôles, attribuables globalement ou par unité d'exploitation. Profils définis pour SUNU :

| Profil | Rôle | Habilitations notables | Explicitement refusé |
|---|---|---|---|
| **Agent collecteur (TPE)** | Encaissement terrain | Souscrire, encaisser une prime, déclarer un versement, imprimer/réimprimer ses propres reçus, consulter ses encaissements | Tout accès back-office ; consultation des données d'autres agents ; confirmation d'un versement ; modification d'un encaissement |
| **Agent back-office** | Traitement quotidien | Revoir les propositions, consulter tous les encaissements, générer et télécharger les exports, gérer les dossiers des assurés | Confirmation des versements ; gestion des utilisateurs ; modification des plafonds ou des frais |
| **Superviseur / Contrôleur** | Contrôle financier | Confirmer les versements, consulter plafonds et soldes, traiter les files d'anomalies, effectuer les rapprochements | Gestion des utilisateurs ; modification de la configuration système |
| **Agent d'émission des cartes** | Chaîne carte | Affecter des cartes, générer les fichiers de personnalisation, marquer les cartes comme écrites, bloquer/remplacer | Opérations financières ; gestion des utilisateurs |
| **Administrateur (SUNU)** | Configuration | Gérer utilisateurs, rôles, agents, terminaux, produits, plafonds, frais | Accès direct à la base ; suppression d'enregistrements d'audit |
| **DSI / Super administrateur** | Technique | Configuration des environnements, intégrations, identifiants, supervision technique | *Configuré sans habilitation de confirmation des versements* — le pouvoir technique ne doit pas égaler le pouvoir financier |

**Principe appliqué de bout en bout : séparation entre celui qui encaisse, celui qui confirme et celui qui configure.** Aucun profil ne détient les trois.

### 5.3 Authentification du collecteur sur le TPE

| Contrôle | Mise en œuvre |
|---|---|
| Justificatif | Identifiant individuel + mot de passe/code, vérifié côté serveur contre l'empreinte bcrypt |
| Première utilisation | Changement de code imposé à la première connexion |
| Jeton de session | Jeton signé de courte durée émis à la connexion, renouvelé à l'activité, invalide après l'expiration sur inactivité. Voir §12 point H-2 |
| Authentification hors ligne | Déverrouillage hors ligne autorisé pendant une période bornée au moyen d'un vérificateur stocké localement ; au-delà, le terminal exige une réauthentification en ligne avant tout nouvel encaissement |
| Liaison au terminal | L'agent est affecté à un terminal déterminé au back-office ; une connexion depuis un terminal non affecté est refusée et donne lieu à alerte. L'identité du terminal est son numéro de série enregistré |
| Révocation | La désactivation de l'agent au back-office refuse l'authentification suivante et rejette les synchronisations de cet agent |
| Inactivité | Verrouillage automatique ; ressaisie du code exigée |

### 5.4 Justificatifs machine à machine (clés d'API)

| Contrôle | Mise en œuvre |
|---|---|
| Portée | Une clé par unité d'exploitation, transmise dans un en-tête dédié |
| Stockage | Hachée au repos ; la valeur en clair est affichée une seule fois à la création et n'est jamais récupérable ensuite |
| Cycle de vie | Indicateur d'activation permettant une révocation instantanée ; horodatage de dernière utilisation ; usage journalisé par requête |
| Rotation | Procédure documentée : créer la nouvelle clé → configurer les terminaux → vérifier le trafic sur la nouvelle clé → révoquer l'ancienne. Rotation au moins annuelle et immédiate en cas de suspicion de compromission |
| Limitation de débit | Par clé et par IP. Voir §12 point H-3 |

### 5.5 Identifiants d'intégration tiers

Les identifiants SUNULIFE, Mobile Money et SMS sont détenus par unité d'exploitation dans un coffre dédié, séparé des définitions d'intégration, chiffrés au repos avec la clé applicative, jamais écrits dans les journaux et jamais réaffichés après saisie. Seul le profil DSI peut les modifier, et chaque modification est auditée.

## 6. Protection des données

### 6.1 Classification

| Classe | Exemples | Traitement |
|---|---|---|
| **C4 — Critique** | Mots de passe, codes, clés de signature, identifiants d'intégration, gabarits biométriques | Chiffrés ou hachés ; jamais journalisés ; jamais exportés ; aucun affichage |
| **C3 — Confidentiel** | Numéros CNIB, images d'identité, données personnelles des assurés, données de polices | Chiffrés au repos et en transit ; accès soumis à habilitation ; accès journalisé ; masqués dans les listes |
| **C2 — Interne** | Encaissements, transactions, plafonds, rapports | Accès par profil ; audité ; exportable par les seuls profils autorisés |
| **C1 — Public** | Noms de produits, documentation générale | Aucune restriction |

### 6.2 Chiffrement en transit

- **HTTPS/TLS 1.2 minimum, TLS 1.3 de préférence**, sur chaque canal : TPE ↔ plateforme, navigateur ↔ plateforme, plateforme ↔ SUNULIFE, plateforme ↔ Mobile Money.
- Suites cryptographiques modernes uniquement ; SSLv3, TLS 1.0 et 1.1 désactivés ; HSTS activé.
- **Épinglage de certificat dans l'application TPE**, ce qui met en échec l'interception par un proxy malveillant sur un réseau mobile hostile.
- HTTP en clair refusé, et non redirigé, sur les points d'entrée d'API. Voir §12 point H-1.

### 6.3 Chiffrement au repos

| Donnée | Protection |
|---|---|
| Mots de passe et codes | Empreinte bcrypt, jamais chiffrée (irréversible par conception) |
| Identifiants d'intégration | Chiffrement symétrique avec la clé applicative, détenue hors du dépôt de code |
| Images d'identité (proposition, CNIB) | Volume de stockage chiffré ; noms de fichiers non devinables ; servies uniquement par un lien authentifié, contrôlé en habilitation et limité dans le temps — jamais par une URL publique |
| Base de données | Chiffrement au repos au niveau du volume ; chiffrement au niveau colonne pour les champs les plus sensibles |
| Sauvegardes | Chiffrées avant de quitter le serveur ; clé détenue séparément des sauvegardes |
| Base locale du TPE | Stockage privé à l'application, chiffré ; effacé à la déconnexion de l'agent affecté ; aucun chemin d'export exposé à l'utilisateur de l'appareil |

### 6.4 Minimisation des données

- Le TPE ne détient que ce dont le collecteur affecté a besoin : ses propres clients et encaissements, et le cache de polices nécessaire au travail hors ligne. **Aucun terminal ne détient jamais l'intégralité du portefeuille clients.**
- Les images d'identité sont téléversées puis supprimées de l'appareil dès acquittement par le serveur.
- Les exports ne contiennent que les colonnes requises par la finalité du rapport.
- Les listes masquent les identifiants sensibles (la CNIB n'est affichée que partiellement) ; l'affichage complet est une action distincte et journalisée.

### 6.5 Données personnelles et droit burkinabè

| Obligation | Réponse |
|---|---|
| Déclaration du traitement à la CIL | **SUNU est le responsable de traitement** et effectue la déclaration ; Rhenium Group agit comme sous-traitant et fournit la description technique requise |
| Base légale | Exécution du contrat d'assurance et mesures précontractuelles |
| Information de la personne concernée | Mention sur le formulaire de proposition et mention résumée sur le reçu |
| Droits d'accès, de rectification et d'effacement | Procédure back-office documentée au Document 3 ; demandes suivies et traitées dans le délai légal |
| Limites de conservation | Appliquées conformément au Document 1 §5.4 ; traitements d'archivage et de purge automatisés |
| Obligations du sous-traitant | Contrat de sous-traitance entre SUNU et Rhenium Group couvrant la confidentialité, les sous-traitants ultérieurs, la notification des violations, la restitution/destruction en fin de contrat |
| Transfert transfrontalier | Dépend de la décision d'hébergement (Doc 1, OP-5). Si l'hébergement est hors du Burkina Faso, le transfert doit être couvert par la déclaration CIL et par des clauses contractuelles |

### 6.6 Données biométriques (capacité optionnelle)

La plateforme prend en charge la capture et la vérification d'empreintes. **Pour SUNU, il s'agit d'une option, non d'un choix par défaut.** Si SUNU l'active :

- Seul un **gabarit mathématique** est stocké, jamais une image d'empreinte ; le gabarit n'est pas réversible en image.
- Le gabarit est une donnée C4 : chiffré, jamais exporté, jamais affiché, jamais transmis à des tiers, y compris SUNULIFE.
- Le consentement explicite, éclairé et écrit de l'assuré est requis, avec une alternative non biométrique toujours disponible.
- Une déclaration CIL spécifique de SUNU est nécessaire, la donnée biométrique constituant une catégorie sensible.
- Recommandation : **ne pas activer la biométrie pour le pilote.** Elle ajoute une complexité juridique et de recueil du consentement sans apport par rapport à carte + QR dans le calendrier de septembre. À réexaminer une fois la solution en production.

## 7. Sécurité des cartes physiques et virtuelles

### 7.1 Propriété de sécurité fondamentale

**Une carte SUNU est un jeton d'identité, non un instrument de paiement.** Elle ne porte aucun solde, ne stocke aucune somme, ne détient aucun justificatif bancaire et ne peut par elle-même autoriser aucun débit. Présenter une carte amène le terminal à *rechercher* un assuré et à afficher ses polices. L'argent ne se déplace que lorsqu'un collecteur authentifié enregistre un encaissement. Ce seul choix de conception élimine toute la classe de risque « carte volée = argent volé ».

### 7.2 Contrôles de la carte physique

| Contrôle | Mise en œuvre |
|---|---|
| Contenu écrit | Identifiant de carte, référence de l'assuré, emplacements de polices. **Ni CNIB, ni adresse, ni montants, ni code** |
| Contenu imprimé | Marque SUNU, nom et prénoms de l'assuré, numéro de carte, expiration — conformément au TdR |
| Résistance au clonage | Cartes sans contact avec clés par carte vivement recommandées plutôt que la piste magnétique, clonable sans difficulté (Doc 1 §7.2, point ouvert OP-3) |
| Cycle de vie | Modèle de statut complet avec motif de blocage, horodatages et chaîne de remplacement ; une carte remplacée est définitivement inutilisable |
| Blocage | Immédiat au back-office ; propagé aux terminaux à la synchronisation suivante et appliqué côté serveur sans délai |
| Contrôle du stock | Les cartes vierges sont inventoriées ; chaque numéro est traçable du stock jusqu'à l'assuré ; comptage périodique rapproché des enregistrements d'émission |
| Station de personnalisation | Physiquement sécurisée, à accès contrôlé, dans un local sous contrôle SUNU ; les fichiers de personnalisation sont générés par lot, transférés par un canal interne et supprimés après usage |

### 7.3 Contrôles de la carte virtuelle (QR)

| Contrôle | Mise en œuvre |
|---|---|
| Intégrité | Charge utile signée cryptographiquement (HMAC-SHA256 ou ECDSA P-256) ; toute altération invalide la signature |
| Vérification hors ligne | Le terminal vérifie la signature sans accès réseau ; un QR contrefait est rejeté sur l'appareil |
| Gestion des clés | Clé de signature versionnée (`kid` dans la charge utile) ; clé privée/HMAC détenue côté serveur dans le coffre ; le terminal ne détient que ce qui lui est nécessaire pour vérifier ; rotation annuelle, avec chevauchement de validité pour que les cartes en circulation continuent de fonctionner |
| Expiration | Chaque justificatif porte une date d'émission et une date d'expiration ; les QR expirés sont refusés |
| Révocation | Liste de révocation synchronisée vers les terminaux à chaque synchronisation ; le rejet côté serveur est immédiat |
| Anti-rejeu | Un QR identifie mais n'autorise jamais. Même un QR parfaitement copié ne produit qu'un encaissement enregistré **au nom du véritable assuré et sur sa véritable police** — il n'y a aucun gain frauduleux |
| Diffusion | Imprimé sur les conditions particulières ou envoyé par lien SMS ; jamais transmis avec un quelconque secret |
| Vie privée | La charge utile contient une référence et un nom d'affichage — ni CNIB, ni adresse, ni montant |

## 8. Contrôles financiers et anti-fraude

Cette section traite la menace de plus haute priorité : le collecteur malhonnête (T1).

### 8.1 Registre d'encaissement en ajout seul

Les encaissements et les transactions ne sont **jamais physiquement supprimés ni écrasés**. Une correction est une écriture nouvelle et inverse, exigeant une habilitation explicite, un motif obligatoire, et générant un enregistrement d'audit. Chaque écriture porte une référence unique et un lien vers son terminal, son agent, son horodatage et, lorsque disponible, sa position GPS.

### 8.2 Le plafond et le versement comme plancher de perte

Le plafond du collecteur (Doc 1 §6.3) est le contrôle financier principal : il **borne le montant maximal qu'un collecteur peut détenir à un instant donné**. Le terminal l'applique — au plafond, les nouveaux encaissements sont refusés jusqu'à confirmation d'un versement. Cela convertit une exposition à la fraude non bornée en une limite connue, paramétrable et propre à chaque collecteur.

### 8.3 Séparation des tâches sur le versement

```
   encaisse  ─────►  COLLECTEUR       (peut déclarer, ne peut pas confirmer)
   confirme  ─────►  SUPERVISEUR      (peut confirmer, ne peut pas encaisser)
   configure ─────►  ADMINISTRATEUR   (fixe le plafond, ne fait ni l'un ni l'autre)
   au-delà du seuil ► SECOND VALIDEUR (maker-checker, montant paramétrable)
```

La confirmation exige une preuve : référence bancaire ou image du bordereau pour un dépôt en banque, procès-verbal de comptage pour une remise en caisse. Tout écart entre le montant déclaré et le montant confirmé est consigné, imputé et signalé — il n'est jamais absorbé silencieusement.

### 8.4 Contrôles de détection

| Contrôle | Objet |
|---|---|
| Numérotation séquentielle des reçus par terminal, avec détection automatique des ruptures | Détecte les reçus supprimés ou détruits |
| Confirmation SMS de l'encaissement au téléphone de l'assuré | L'assuré devient un témoin indépendant de chaque encaissement — le contrôle isolé le plus efficace contre TH-1 |
| Position GPS sur chaque encaissement | Détecte les encaissements enregistrés loin de tout lieu client plausible, ou regroupés au domicile du collecteur |
| Analyse temporelle | Signale les séquences improbables (nombreux encaissements en quelques secondes, activité à des heures invraisemblables) |
| Ancienneté des soldes non versés | Signale les collecteurs détenant des espèces plus longtemps que la politique ne l'autorise |
| Rapprochement : encaissements − versements confirmés = solde non versé | Contrôle croisé permanent |
| Rapprochement des règlements Mobile Money | Aucun encaissement MoMo n'est définitif tant qu'il n'apparaît pas dans le fichier de règlement de l'opérateur |
| Rejet des références en doublon au niveau de la base | Rend le double enregistrement structurellement impossible, y compris en cas de renvoi |
| Alerte volumétrique sur les exports et les consultations sensibles | Détecte l'exfiltration de données par un utilisateur interne |

### 8.5 Intégrité du reçu

Le reçu est produit par l'application, non saisi par le collecteur. Il porte le numéro de reçu, le produit, le numéro de police ou de proposition, le montant, la date et l'heure, la référence du collecteur et l'identité du terminal. Une réimpression est explicitement marquée **DUPLICATA** et est elle-même journalisée. La communication aux assurés doit énoncer clairement : *un paiement sans reçu SUNU imprimé n'est pas un paiement.*

| Contrôle | Mise en œuvre |
|---|---|
| Registre du parc | Chaque terminal enregistré avec numéro de série, SIM, alias et modèle ; affectation à un agent nommé avec historique daté |

## 10. Sécurité des intégrations

### 10.1 SUNULIFE

| Contrôle | Mise en œuvre |
|---|---|
| Transport | TLS 1.2+ obligatoire. Si SUNULIFE est hébergé dans les locaux de SUNU, un VPN site à site ou un lien privé est préférable à l'Internet public |
| Authentification | Selon ce qu'exige SUNULIFE : OAuth 2.0, JWT bearer, HTTP basic ou TLS mutuel — le cadre d'adaptateur prend déjà en charge ces stratégies |
| Moindre privilège | Le compte d'intégration ne se voit accorder que les opérations du Doc 1 §8.2 — aucun droit d'administration dans SUNULIFE |
| Restriction réseau | SUNU inscrit les adresses IP de sortie de la plateforme sur liste d'autorisation |
| Validation des entrées | Chaque champ reçu de SUNULIFE est validé au regard du schéma avant de toucher la base ; les charges utiles malformées ou anormales sont mises en quarantaine, non appliquées |
| Non destructif par construction | Une synchronisation depuis SUNULIFE ne peut jamais supprimer ni altérer un enregistrement d'encaissement local |
| Traçabilité | Journalisation complète requête/réponse avec masquage des champs sensibles ; chaque échange rejouable et idempotent |
| Isolation de disponibilité | Coupe-circuit ; une indisponibilité SUNULIFE ne bloque jamais l'encaissement terrain |

### 10.2 Mobile Money

| Contrôle | Mise en œuvre |
|---|---|
| Identifiants | Détenus dans le coffre chiffré ; identifiants distincts par environnement ; jamais dans le dépôt de code |
| Authentification des rappels | Les rappels de l'opérateur sont vérifiés par signature et par liste d'IP sources autorisées ; un rappel non vérifié est rejeté et signalé |
| Idempotence | Chaque initiation porte une clé d'idempotence ; un rappel répété ne peut pas créer un second encaissement |
| Contrôle du montant | Le montant confirmé par l'opérateur est comparé au montant demandé ; toute divergence bloque l'encaissement et lève une anomalie |
| Aucun traitement du code | L'assuré saisit son code Mobile Money **sur son propre téléphone, sur le canal de l'opérateur**. Le code ne transite jamais par le TPE, l'application ou la plateforme |
| Rapprochement des règlements | Rapprochement quotidien à trois voies (plateforme / rapport opérateur / crédit bancaire) avec file d'anomalies horodatée |
| Gestion des expirations | Un paiement non confirmé reste en attente et est résolu par le rapprochement ; **le reçu n'est imprimé qu'après confirmation** |

### 10.3 SMS

Identifiants de l'opérateur dans le coffre ; contenu des messages limité au strict nécessaire (montant, référence de police, date) avec **ni CNIB, ni détail complet de police, ni lien porteur d'un secret** ; statut de remise journalisé.

## 11. Journalisation, audit et supervision

### 11.1 Ce qui est consigné

| Journal | Contenu | Conservation |
|---|---|---|
| **Piste d'audit** | Toute création/modification/suppression sur une entité sensible : acteur, action, objet, valeurs avant/après, horodatage, IP, regroupé par lot d'opération | 5 ans |
| **Journal d'authentification** | Succès et échecs, back-office et TPE, avec IP, terminal et agent utilisateur | 12 mois |
| **Journal API** | Un middleware dédié consigne déjà le trafic API des transactions, des cartes et des OTP : point d'entrée, charge utile (champs sensibles masqués), réponse, statut, latence | 12 mois |
| **Journal financier** | Chaque encaissement, versement, confirmation, correction et modification de plafond | 10 ans |
| **Journal d'intégration** | Chaque échange SUNULIFE et Mobile Money avec statut et nombre de tentatives | 24 mois |
| **Journal technique** | Erreurs, exceptions, performance | 90 jours |

### 11.2 Protection des journaux

Les journaux sont en ajout seul pour les utilisateurs applicatifs ; aucun profil applicatif ne peut supprimer un enregistrement d'audit. Les valeurs sensibles (mots de passe, codes, jetons, CNIB complète, gabarits biométriques) sont masquées au moment de l'écriture — une configuration de journalisation susceptible de les émettre en clair ne doit pas exister en production. Voir §12 point H-6.

### 11.3 Alertes

| Événement | Gravité | Destinataire |
|---|---|---|
| Échecs d'authentification répétés sur un compte | Moyenne | Administrateur |
| Connexion depuis un terminal non affecté | Élevée | Superviseur + Administrateur |
| Appareil rooté ou altéré détecté | Élevée | DSI |
| Rupture détectée dans la numérotation des reçus | Élevée | Superviseur |
| Collecteur au-dessus du plafond depuis plus de N jours | Moyenne | Superviseur |
| Écart de versement au-delà de la tolérance | Élevée | Superviseur + Finance |
| Volume d'export anormal | Élevée | Administrateur + DSI |
| Taux d'échec d'intégration au-dessus du seuil | Moyenne | DSI |
| Rappel Mobile Money non vérifié | Élevée | DSI |
| Échec de sauvegarde | Élevée | DSI |

### 11.4 Cadence de revue

Quotidienne : file d'alertes et files d'anomalies. Hebdomadaire : rapprochement des plafonds et des versements. Mensuelle : revue des accès des comptes privilégiés, santé des intégrations. Trimestrielle : revue complète des utilisateurs et habilitations, test de restauration des sauvegardes, revue des correctifs de sécurité.

## 12. Programme de durcissement — points préexistants à corriger

Ces points existent dans la plateforme actuelle et sont **corrigés dans le cadre du présent projet**, avant la mise en production. Ils sont listés ouvertement afin que SUNU puisse vérifier chacun d'eux à la réception. Chacun porte une échéance alignée sur le Document 4.

| # | Point | État actuel | Correction | Échéance |
|---|---|---|---|---|
| **H-1** | **Sécurité du transport** | L'URL de base d'API par défaut de l'application TPE est en `http://` en clair, et les points d'entrée d'API acceptent HTTP | Imposer HTTPS de bout en bout ; refuser le clair sur l'API ; ajouter l'épinglage de certificat dans l'application TPE ; HSTS sur le back-office | **Avant la recette** — jalon obligatoire |
| **H-2** | **Jeton de session du collecteur** | La connexion TPE renvoie le profil de l'agent mais n'émet aucun jeton de session borné ; les appels suivants reposent sur une clé d'API partagée | Émettre un jeton signé de courte durée par agent, renouvelé à l'activité, révocable côté serveur et invalidé sur inactivité | Avant le pilote |
| **H-3** | **Limitation de débit des API** | Les routes d'API ne sont pas limitées en débit | Limitation par clé d'API, par agent et par IP, avec verrouillage progressif et alerte | Avant le pilote |
| **H-4** | **Cryptographie côté mobile** | Un utilitaire de traitement des codes dans l'application TPE utilise une clé symétrique codée en dur dans l'application, en mode ECB. Une clé présente dans l'APK est extractible, et l'ECB laisse transparaître la structure | Supprimer la clé codée en dur ; clés par appareil provisionnées à l'enrôlement et stockées dans le keystore Android ; AES-GCM (chiffrement authentifié) en remplacement de l'ECB ; vérification du code côté serveur contre l'empreinte bcrypt plutôt que par chiffrement réversible sur l'appareil | Avant le pilote |
| **H-5** | **MFA pour les profils privilégiés** | L'authentification back-office est à facteur unique | Second facteur TOTP ou SMS, obligatoire pour les profils Administrateur et DSI | Avant la production |
| **H-6** | **Commutateur de journalisation en clair** | Un indicateur de configuration peut faire journaliser les codes à usage unique en clair | Indicateur définitivement désactivé en production et retiré de la configuration de production ; vérifié par la liste de contrôle de mise en service | Avant la recette |
| **H-7** | **Efficacité de la recherche de clé d'API** | La vérification parcourt toutes les clés actives en effectuant une comparaison d'empreinte sur chacune — correct, mais linéaire en nombre de clés et coûteux en CPU | Recherche indexée sur un préfixe de clé, puis une seule comparaison à temps constant | Avant la production |
| **H-8** | **En-têtes de sécurité** | Non entièrement configurés | Content-Security-Policy, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy | Avant la production |
| **H-9** | **Gestion des secrets** | Secrets détenus dans la configuration d'environnement sur le serveur | Permissions de fichier restreintes, exclusion du dépôt, procédure de rotation documentée ; coffre à secrets géré si le choix d'hébergement le permet | Avant la production |
| **H-10** | **Gestion des dépendances et des correctifs** | Au cas par cas | Analyse mensuelle de vulnérabilité des dépendances ; fenêtre de correctifs documentée ; correctifs critiques sous 7 jours | En continu dès la mise en service |

**Position de réception :** H-1, H-4 et H-6 sont traités comme **bloquants** — le pilote ne démarre pas sans eux. Les autres sont planifiés avant la mise en production de novembre et vérifiés par la liste de contrôle de la section 16.

## 14. Procédures de sécurité pour SUNU

La technologie ne fait que la moitié du contrôle. Voici les responsabilités opérationnelles de SUNU.

### 14.1 Entrée et sortie d'un collecteur

**Entrée :** vérification d'identité et enquête de moralité selon la politique RH de SUNU → compte créé par l'Administrateur avec le seul profil Agent collecteur → terminal affecté et consigné → code remis par un canal distinct et changé à la première utilisation → plafond fixé → briefing de sécurité signé (garde du terminal, non-partage du code, discipline des reçus, signalement immédiat en cas de perte).

**Sortie, exécutée le jour même :** terminal restitué et son affectation close → toutes les espèces versées et confirmées → compte désactivé (jamais supprimé) → solde résiduel rapproché à zéro → cartes en possession du collecteur restituées et rapprochées du stock.

### 14.2 Revue des accès

Chaque trimestre, l'Administrateur passe en revue chaque compte et ses habilitations avec le responsable de service concerné ; les comptes inutilisés sont désactivés ; la revue est documentée et conservée.

### 14.3 Stock de cartes

Les cartes vierges sont conservées dans un local fermé sous la responsabilité d'un dépositaire nommé. Les mouvements d'entrée et de sortie sont consignés. Un comptage mensuel rapproche le stock physique des enregistrements d'émission du back-office ; tout écart fait l'objet d'une enquête en tant qu'incident de sécurité.

### 14.4 Gestion des justificatifs

Les codes et mots de passe sont remis par un canal distinct de celui de l'identifiant, changés à la première utilisation, jamais partagés, jamais écrits, jamais transmis par courriel ou messagerie. Aucun collaborateur de SUNU ou de Rhenium Group ne demandera jamais à un collecteur ou à un assuré son code.

### 14.5 Sensibilisation

Briefing de sécurité à l'entrée, rappel annuel, et court rappel trimestriel sur les risques qui comptent réellement ici : hameçonnage sur les comptes back-office, discipline des reçus sur le terrain, garde du terminal, et signalement immédiat de tout fait inhabituel.

## 16. Assurance

### 16.1 Réponse aux incidents

| Étape | Action | Délai |
|---|---|---|
| 1. Détecter | Alerte, signalement utilisateur ou supervision | En continu |
| 2. Qualifier | Gravité évaluée selon l'échelle ci-dessous | ≤ 1 h |
| 3. Contenir | Désactiver le compte, révoquer la clé, isoler le terminal, bloquer la carte | ≤ 4 h (critique) |
| 4. Notifier | Contact incident SUNU ; CIL en cas de violation de données personnelles ; personnes assurées si la loi l'exige | Selon le délai légal |
| 5. Éradiquer et rétablir | Corriger, restaurer depuis sauvegarde si nécessaire, vérifier l'intégrité | Selon la gravité |
| 6. Revoir | Rapport post-incident écrit, cause racine, actions correctives avec responsables et dates | ≤ 10 jours ouvrés |

| Gravité | Définition | Exemples |
|---|---|---|
| **Critique** | Violation de données personnelles, fraude systémique, panne totale | Exfiltration de la base, compromission d'un compte administrateur |
| **Élevée** | Fraude localisée, perte d'un terminal avec données, compromission d'intégration | Collecteur malhonnête, terminal volé |
| **Moyenne** | Tentative sans impact, dysfonctionnement isolé | Tentative de force brute bloquée |
| **Faible** | Anomalie mineure | Erreur de configuration isolée |

### 16.2 Tests avant mise en service

| Test | Périmètre | Quand |
|---|---|---|
| Test d'authentification et d'habilitations | Chaque profil face à chaque action restreinte, y compris tests négatifs | Avant la recette |
| Analyse de vulnérabilité applicative | Back-office et API — OWASP Top 10 | Avant la recette et avant la production |
| Revue de l'application TPE | Alignée MASVS : stockage, cryptographie, transport, anti-altération | Avant le pilote |
| Tests de scénarios de fraude | Chaque scénario du §3.2 rejoué en recette | Pendant la recette |
| Test de restauration | Restauration complète depuis sauvegarde dans un environnement vierge | Avant la production |
| Test de charge | Volume d'encaissement de pointe | Avant la production |
| Test d'intrusion indépendant | Recommandé, commandé par SUNU | Recommandé avant la production |

### 16.3 Développement sécurisé et gestion des changements

Code source versionné ; revue par les pairs avant fusion ; aucun secret dans le dépôt ; environnements séparés sans données réelles en recette ; livraisons versionnées, documentées dans un journal des changements et approuvées par SUNU avant production ; retour arrière documenté pour chaque livraison ; analyse mensuelle de vulnérabilité des dépendances ; correctifs critiques sous 7 jours.

## 0. Premiers pas — pour tous

### 0.1 Votre compte

Votre compte est créé par l'administrateur SUNU. Vous recevez :

- un **identifiant** ;
- un **mot de passe ou code provisoire**, transmis séparément de l'identifiant.

À la première connexion, vous devez le changer. Choisissez quelque chose dont vous vous souviendrez sans avoir à l'écrire.

> **Règles de sécurité valables pour tous les profils.** Ne partagez jamais votre mot de passe ni votre code. Ne laissez jamais quelqu'un d'autre travailler sous votre compte — chaque action est enregistrée à votre nom et vous en répondez. Personne, ni chez SUNU ni chez Rhenium Group, ne vous demandera jamais votre code. Si vous pensez que quelqu'un le connaît, changez-le immédiatement et prévenez votre superviseur.

### 0.2 Choisir votre langue

L'ensemble de la solution fonctionne en **français et en anglais**, sur le terminal comme au back-office. Changez de langue à tout moment depuis le sélecteur ; votre choix est mémorisé pour la fois suivante.

### 0.3 Si vous êtes bloqué

Après plusieurs tentatives erronées, votre compte se verrouille temporairement. Patientez, puis réessayez. Si vous avez réellement oublié votre mot de passe, contactez l'administrateur : il le réinitialise et vous en définissez un nouveau à la connexion suivante. Personne ne peut lire votre mot de passe existant, pas même la DSI.

# PARTIE A — AGENT COLLECTEUR (terminal TPE)

*Vous êtes la personne sur le terrain. Vous souscrivez de nouveaux clients et encaissez les primes. Cette partie est votre manuel complet.*

## A.1 Votre terminal

Votre terminal vous est affecté personnellement et enregistré à votre nom. Vous ne pouvez pas travailler sur le terminal de quelqu'un d'autre, et cette personne ne peut pas travailler sur le vôtre.

| Ce qu'il possède | Ce à quoi cela vous sert |
|---|---|
| Écran tactile | Tout |
| Appareil photo | Photographier la proposition et la CNIB du client |
| Lecteur de carte | Lire la carte SUNU du client |
| Imprimante | Les reçus |
| GPS | Enregistrer le lieu de la souscription ou de l'encaissement |
| SIM / données mobiles | Envoyer les données au back-office |

**Avant de partir le matin :** terminal chargé, rouleau de papier en place plus un rouleau de secours, une connexion réussie tant que vous avez encore un bon réseau.

## A.2 Se connecter

〔ÉCRAN : connexion〕

1. Allumez le terminal, ouvrez l'application SUNU.
2. Saisissez votre **identifiant**.
3. Saisissez votre **code**.
4. Appuyez sur **Se connecter**.

L'écran d'accueil affiche : votre nom, votre terminal, **votre encaisse non versée actuelle** et la marge qu'il vous reste avant votre plafond.

**Le terminal se verrouille tout seul** après une période d'inactivité. Ressaisissez votre code pour continuer — rien n'est perdu.

**Travailler sans réseau.** Vous pouvez vous connecter et travailler hors ligne pendant une période bornée après votre dernière connexion en ligne. Au-delà, le terminal vous demande de vous reconnecter une fois. Prévoyez d'être en zone couverte au moins une fois par jour.

## A.3 L'écran d'accueil et la signification des couleurs

Le **compteur ⟳** indique les éléments pas encore envoyés au back-office. Il se vide de lui-même dès que vous avez du réseau. Il est normal de le voir sur le terrain.

## A.4 Nouvelle souscription (avec première prime)

*À utiliser lorsqu'un prospect signe une nouvelle police.*

**Avant de toucher au terminal :** remplissez la proposition papier, faites-la signer par le client et ayez sa CNIB à portée de main. Le document papier reste le contrat juridique — le terminal le capture et le transmet.

〔ÉCRAN : assistant de souscription〕

**Étape 1 — Produit.** Sélectionnez le produit (par exemple Micro-Quiétude, Micro Épargne Retraite).

**Étape 2 — Numéro de proposition.** Saisissez le numéro imprimé sur la proposition papier. Saisissez-le avec soin — c'est par lui que le back-office et SUNULIFE rattacheront cette souscription.

**Étape 3 — Identité du client.** Nom, prénom(s), date de naissance, numéro de téléphone, numéro CNIB. Si le client dit être déjà client SUNU, utilisez d'abord **Rechercher un client existant** : s'il est trouvé, ses données se remplissent automatiquement et aucun doublon n'est créé.

**Étape 4 — Photographies.** Trois photographies :
1. la **proposition signée** ;
2. la **CNIB, recto** ;
3. la **CNIB, verso**.

Tenez le terminal bien stable, cadrez le document plein écran, évitez les ombres et les reflets. Après chaque prise, le terminal vous montre le résultat : appuyez sur **Reprendre** si un texte est illisible. *Une photo floue signifie que le back-office ne peut pas traiter le dossier et que quelqu'un vous rappellera à ce sujet.*

**Étape 5 — Localisation.** Le terminal capture le GPS automatiquement. Attendez l'indicateur vert. Si le GPS n'accroche pas — à l'intérieur d'un bâtiment par exemple — sortez un instant ; si cela échoue encore, continuez : la souscription n'est pas bloquée.

**Étape 6 — Frais de police.** Saisissez le montant reçu au titre des frais de police → **Encaisser** → **le terminal imprime le reçu n° 1**. Remettez-le au client.

**Étape 7 — Première prime.** Saisissez le montant de la première prime → **Encaisser** → **le terminal imprime le reçu n° 2**. Remettez-le au client.

> **Ce sont deux reçus distincts et les deux doivent être remis.** Un pour les frais de police, un pour la première prime. C'est une exigence formelle de SUNU.

**Étape 8 — Confirmation.** Un récapitulatif s'affiche. Si vous avez du réseau, le dossier part immédiatement ; sinon il rejoint la file et partira tout seul plus tard. **Dans les deux cas, le client est bien enregistré et détient des reçus valables.**

**Ce qui se passe ensuite.** Le back-office examine le dossier, le valide et commande la carte du client. Le client est informé de la façon dont il la recevra.

## A.5 Encaisser une prime auprès d'un client existant

*C'est votre opération la plus fréquente.*

〔ÉCRAN : encaisser une prime〕

**Étape 1 — Identifier le client.** Trois moyens :

| Moyen | Comment | Quand |
|---|---|---|
| **Carte SUNU** | Appuyez sur **Encaisser une prime**, posez la carte sur le lecteur | Cas normal |
| **QR Code (carte virtuelle)** | Appuyez sur **Scanner le QR**, cadrez le code sur le téléphone du client ou sur ses conditions particulières | Le client n'a pas de carte physique |
| **Recherche manuelle** | Appuyez sur **Rechercher**, saisissez le numéro de police, le nom ou le téléphone | Carte perdue ou illisible |

**Étape 2 — Vérifier le client.** L'écran affiche le nom de l'assuré et la **liste de ses polices actives**. Vérifiez le nom à voix haute avec le client.

**Étape 3 — Choisir la police.** Touchez la police concernée par le paiement. Si le client a plusieurs polices, demandez-lui laquelle — ne devinez pas. L'écran affiche la prime attendue et la prochaine échéance.

**Étape 4 — Saisir le montant.** Tapez le montant reçu. La prime attendue est proposée ; vous pouvez la modifier si le client paie un montant différent.

**Étape 5 — Choisir le mode de paiement.**

| Mode | Ce qui se passe |
|---|---|
| **Espèces** | Vous prenez l'argent. **Cela s'impute sur votre plafond.** |
| **Mobile Money** | Saisissez le numéro du client. **Le client reçoit une invite sur son propre téléphone et y saisit son propre code.** Attendez la confirmation sur votre écran. **Cela ne s'impute pas sur votre plafond** — l'argent va directement à SUNU |

> **Ne demandez jamais à un client son code Mobile Money, et ne le saisissez jamais vous-même.** Le client le saisit sur son propre appareil. Quiconque demande ce code commet une fraude.

**Étape 6 — Reçu.** Le terminal imprime le reçu. **Remettez-le au client.** Pour le Mobile Money, le reçu ne s'imprime **qu'après confirmation du paiement** — s'il n'est pas confirmé, pas de reçu, et aucun argent n'a bougé.

## A.6 Réimprimer un reçu

**Ma journée → trouvez l'encaissement → Réimprimer.** La copie porte la mention **DUPLICATA**. Chaque réimpression est enregistrée. Utilisez-la lorsque l'imprimante se bloque ou que le papier se déchire — pas pour produire un second « original ».

## A.7 Suivre votre journée

**Ma journée** affiche : le nombre d'encaissements, le total encaissé, la répartition espèces / Mobile Money, la liste des opérations du jour et les éléments restant à synchroniser.

Consultez-la avant de terminer votre journée. **Les espèces dans votre sacoche doivent être égales au total espèces affiché.** Si ce n'est pas le cas, ne rentrez pas chez vous sans prévenir votre superviseur.

## A.8 Verser (libérer votre plafond)

*À faire dès que la barre passe à l'orange, et toujours avant qu'elle ne passe au rouge.*

**Étape 1.** Déposez physiquement l'argent : soit à la banque sur le compte SUNU désigné, soit à une caisse SUNU.

**Étape 2.** Sur le terminal : **Verser** →
- montant déposé ;
- mode (dépôt bancaire / caisse) ;
- référence bancaire ou numéro de bordereau ;
- **photographie du bordereau de dépôt** (vivement recommandée — elle accélère la confirmation).

**Étape 3.** Validez. Le statut devient **Déclaré, en attente de confirmation**.

**Étape 4.** Le superviseur le vérifie au regard du relevé bancaire ou du comptage en caisse et le confirme. Votre solde diminue, la barre repasse au vert et l'encaissement est débloqué. C'est généralement le jour même ; cela dépend du moment où le relevé bancaire est disponible.

> **Déclarer un versement ne libère pas à lui seul votre plafond.** Seule la confirmation du superviseur le fait. Versez donc *avant* d'être bloqué, pas après.

## A.9 Travailler sans réseau

Tout ce qui suit fonctionne hors ligne :

| Fonctionne hors ligne | Nécessite le réseau |
|---|---|
| Se connecter (dans la période hors ligne suivant votre dernière connexion en ligne) | La toute première connexion sur un terminal neuf |
| Saisie complète d'une souscription, photos, GPS | Rechercher un client absent de votre cache local |
| Encaisser depuis une carte ou un QR (client en cache) | Les paiements Mobile Money |
| Imprimer les reçus | Confirmer un versement |
| Consulter votre journée | |

Le compteur ⟳ indique ce qui est en attente. Dès que vous retrouvez du réseau, tout part automatiquement. **Ne réinstallez pas l'application et n'effacez pas les données de l'application tant que des éléments sont en attente** — vous détruiriez des encaissements qui ne sont pas encore parvenus au back-office. Si le compteur refuse de se vider pendant plus d'une journée, appelez le support.

## A.10 Ce que vous ne devez jamais faire

- Ne jamais encaisser d'argent sans imprimer de reçu.
- Ne jamais garder la carte d'un client.
- Ne jamais demander le code Mobile Money d'un client.
- Ne jamais prêter votre terminal ni votre code.
- Ne jamais dépasser le délai autorisé pour verser.
- Ne jamais promettre quoi que ce soit à un client au sujet de son contrat — c'est le rôle du back-office, pas le vôtre.

## A.11 En cas de problème

| Situation | Que faire |
|---|---|
| Terminal perdu ou volé | **Appelez immédiatement votre superviseur.** Le compte est désactivé à distance. Il n'y a aucune espèce sur l'appareil |
| Terminal cassé | Signalez-le ; un terminal de secours vous est affecté. Les encaissements non encore envoyés sont récupérés si l'appareil est réparé |
| Carte illisible | Utilisez la recherche manuelle ; signalez la carte pour qu'un remplacement soit émis |
| Le client conteste un paiement | Réimprimez le reçu, notez la référence, renvoyez au back-office. Ne remboursez pas de votre poche |
| Argent encaissé mais le client est parti avant l'impression du reçu | Notez la référence, appelez le superviseur le jour même. **Ne supprimez rien** |
| Montant erroné saisi | N'essayez pas de le corriger vous-même. Signalez-le : le back-office établit une écriture de correction |

# PARTIE B — AGENT BACK-OFFICE

*Vous traitez ce qui remonte du terrain : dossiers de souscription, encaissements, exports, dossiers clients.*

## B.1 Se connecter et votre tableau de bord

Ouvrez l'adresse du back-office dans votre navigateur, saisissez vos identifiants. 〔ÉCRAN : tableau de bord〕

Votre tableau de bord affiche : les encaissements et totaux du jour, les **propositions en attente de revue** (votre file principale), les collecteurs actifs et l'état de leur plafond, les anomalies à traiter et les derniers exports.

## B.2 Examiner les dossiers de souscription — votre tâche centrale

**Menu : Souscriptions → En attente de revue.** Chaque ligne est un dossier envoyé du terrain.

Pour chaque dossier :

1. Ouvrez-le. À gauche, les données saisies ; à droite, les photographies.
2. **Vérifiez les photographies.** La proposition est-elle lisible ? Est-elle signée ? La CNIB est-elle lisible sur les deux faces ?
3. **Vérifiez la cohérence.** Le nom sur la proposition correspond-il au nom saisi ? Le numéro de proposition correspond-il au document papier ? Le produit correspond-il ?
4. **Vérifiez les paiements.** Frais de police et première prime présents, et cohérents avec le tarif du produit ?
5. **Vérifiez l'absence de doublon.** Le système signale un client existant possible par CNIB ou par téléphone. S'il s'agit de la même personne, utilisez **Fusionner** plutôt que de créer un second dossier.

Puis décidez :

| Décision | Effet |
|---|---|
| **Accepter** | Police créée, émission de carte mise en file (Partie D), dossier clos |
| **Demander une correction** | Retourné au collecteur avec votre commentaire (par exemple « photo de la CNIB illisible ») |
| **Rejeter** | Dossier clos avec motif obligatoire. **Les encaissements déjà effectués ne sont pas annulés** — l'argent reçu reste enregistré. Tout remboursement relève d'une décision de gestion distincte |

> **N'acceptez jamais un dossier dont vous ne pouvez pas lire les photographies.** La photographie est la preuve de la souscription. Demandez une correction — cela coûte deux minutes au collecteur et évite un litige plus tard.

## B.3 Consulter les encaissements

**Menu : Encaissements.** Filtrez par date, collecteur, produit, police, mode de paiement, montant, statut.

Chaque encaissement affiche : date et heure, collecteur, terminal, assuré, police, montant, mode, numéro de reçu, référence unique, position GPS lorsqu'elle a été capturée, et l'état de transmission vers SUNULIFE.

Vues utiles : *Aujourd'hui*, *Ce collecteur*, *Mobile Money en attente*, *Non encore transmis à SUNULIFE*.

## B.4 Export Excel — saisie dans SUNULIFE

*C'est l'opération que le TdR exige explicitement.*

1. **Menu : Rapports → Encaissements.**
2. Fixez la période et les filtres éventuels (collecteur, produit, mode de paiement).
3. Choisissez le format **Excel (XLSX)**.
4. **Générer**. Le rapport est produit en arrière-plan — vous pouvez continuer à travailler.
5. Lorsque le statut affiche **Prêt**, cliquez sur **Télécharger**.

Le fichier contient une ligne par encaissement avec les champs requis par SUNULIFE : date, produit, numéro de police, numéro de proposition, assuré, montant, mode de paiement, numéro de reçu, référence du collecteur, terminal, référence unique.

**Bonne pratique :** exportez **une fois par jour à heure fixe**, sur une période qui ne chevauche pas l'export précédent, et saisissez dans SUNULIFE le jour même. Conservez le fichier. Lorsque l'intégration automatique SUNULIFE sera activée (Document 1 §8.4), cet export restera disponible comme moyen de contrôle et de repli — il ne disparaît pas.

## B.5 Gérer les clients et les polices

**Menu : Clients.** Recherchez par nom, téléphone, CNIB, numéro de police ou de carte.

Un dossier client affiche l'identité, les documents, les polices, les cartes (physiques et virtuelles) et l'historique complet des encaissements.

| Action | Remarque |
|---|---|
| Corriger une donnée d'identité | Audité ; corrigez une faute de frappe, n'écrasez pas une personne différente |
| Ajouter un document | Pour une CNIB renouvelée, par exemple |
| Fusionner deux dossiers | Uniquement lorsqu'il s'agit à coup sûr de la même personne ; l'opération est tracée et réversible seulement par la DSI |
| Demander une carte | Envoie la demande à l'agent cartes (Partie D) |
| Émettre une carte virtuelle (QR) | Immédiat ; envoyée par SMS ou imprimée |

**Protection des données.** Vous voyez des données personnelles parce que votre fonction l'exige. N'exportez pas au-delà de ce dont vous avez besoin, ne les transmettez pas hors de SUNU et n'en discutez pas hors de votre rôle. Chaque export est journalisé à votre nom.

## B.6 Files d'anomalies

**Menu : Anomalies.**

| File | Ce que cela signifie | Ce que vous faites |
|---|---|---|
| **Mobile Money en attente** | Paiement ni confirmé ni échoué | Attendez le rapprochement ; si toujours en attente après 24 h, escaladez à la DSI |
| **Rejeté par SUNULIFE** | La transmission a été refusée | Lisez l'erreur, corrigez la donnée s'il s'agit d'un problème de données, resoumettez ; escaladez si c'est technique |
| **Doublon possible** | Deux dossiers clients semblent désigner la même personne | Comparez et fusionnez, ou écartez |
| **Encaissement non rattaché** | Encaissement sans lien de police valable | Identifiez la bonne police et rétablissez le lien |

Traitez-les **quotidiennement**. Elles ne se résolvent pas d'elles-mêmes et elles s'accumulent.

---

# PARTIE C — SUPERVISEUR / CONTRÔLEUR

*Vous êtes le contrôle financier. Votre validation libère les collecteurs et atteste que l'argent de SUNU est bien arrivé.*

## C.1 Votre tableau de bord

Il affiche : les **versements en attente de confirmation** (votre priorité), tous les collecteurs avec le taux d'utilisation de leur plafond, les collecteurs bloqués, les alertes d'écart, l'ancienneté des soldes non versés, les totaux du jour et de la semaine.

## C.2 Confirmer un versement — votre responsabilité critique

**Menu : Versements → En attente de confirmation.**

Pour chaque déclaration, vous voyez : le collecteur, le montant déclaré, le mode, la référence bancaire, la photo du bordereau, la date et l'heure de déclaration, et le solde du collecteur avant et après.

**Procédure :**

1. **Vérifiez à la source.** Dépôt bancaire → retrouvez le crédit sur le relevé. Caisse → obtenez le procès-verbal de comptage auprès du caissier.
2. **Comparez** le montant réellement reçu au montant déclaré.
3. Puis :

| Cas | Action |
|---|---|
| Les montants correspondent | **Confirmez.** Le solde diminue, le terminal est libéré |
| Reçu *moins* que déclaré | **Confirmez le montant réel.** L'écart est consigné au nom du collecteur et signalé. Informez votre hiérarchie le jour même |
| Reçu *plus* que déclaré | Confirmez le montant réel ; notez le motif |
| Rien reçu | **Rejetez** avec un motif. Le collecteur reste bloqué. Escaladez immédiatement |

> **Ne confirmez que sur preuve.** Confirmer sans avoir vu le crédit bancaire ou le procès-verbal de comptage revient à déclarer que SUNU détient un argent qu'elle ne détient peut-être pas. Au-delà d'un montant paramétré, un second valideur est requis — cela vous protège autant que cela protège SUNU.

## C.3 Surveiller les plafonds

**Menu : Collecteurs → Plafonds.**

| Signal | Lecture | Action |
|---|---|---|
| Collecteur en permanence proche de son plafond | Plafond trop bas, ou versements trop rares | Revoyez le plafond, ou le rythme des versements |
| Solde dont l'ancienneté dépasse la limite de la politique | Espèces détenues trop longtemps | Appelez le collecteur aujourd'hui |
| Collecteur bloqué depuis plus d'une journée | Travail à l'arrêt | Relancez le versement ou la confirmation |
| Encaissements sans versement correspondant sur une longue période | **Signal d'alerte** | Enquêtez sans délai |

## C.4 Indicateurs de fraude à surveiller chaque semaine

| Indicateur | Lecture possible |
|---|---|
| Rupture dans la numérotation des reçus d'un terminal | Reçus supprimés ou détruits |
| Encaissements regroupés sur un même point GPS loin de tout client | Encaissements fictifs |
| Encaissements enregistrés à des heures invraisemblables | Pratique irrégulière |
| Écarts répétés sur les versements d'un même collecteur | Détournement |
| Réimpressions fréquentes sur les mêmes encaissements | Reçus remis en double |
| Nombreuses corrections demandées par un même collecteur | Mauvaise pratique ou manipulation |

Le système les remonte automatiquement. **Traitez une alerte comme une question à poser, non comme une accusation.** La plupart ont une explication innocente ; celles qui n'en ont pas doivent être escaladées par écrit le jour même.

## C.5 Rapprochement

**Hebdomadaire :** total encaissé − total des versements confirmés = somme des soldes non versés. Si cela ne s'équilibre pas, escaladez à la DSI en précisant la période concernée.

**Quotidien pour le Mobile Money :** total plateforme face au rapport de règlement de l'opérateur face au montant crédité sur le compte bancaire. Tout écart part en file d'anomalies.

---

# PARTIE D — AGENT D'ÉMISSION DES CARTES

*Vous produisez et délivrez les cartes SUNU, physiques et virtuelles.*

## D.1 Stock de cartes

**Menu : Cartes → Stock.** Les cartes vierges sont enregistrées et chaque numéro est traçable du stock jusqu'à l'assuré.

| Tâche | Fréquence |
|---|---|
| Enregistrer une nouvelle livraison de cartes vierges | À la réception |
| Comptage physique face à l'enregistrement système | Mensuel |
| Signaler tout écart | Immédiatement — c'est un incident de sécurité |

## D.2 Émettre une carte physique

**Menu : Cartes → Demandes.** Chaque demande provient d'une souscription acceptée.

1. Ouvrez la demande. Vérifiez le nom de l'assuré et la **liste des polices** — la carte doit porter toutes les polices actives de cet assuré, comme l'exige le TdR.
2. **Affectez une carte** depuis le stock. Le système attribue le numéro et l'expiration.
3. **Générez le fichier de personnalisation** — il contient le bloc de marque SUNU, le nom et les prénoms de l'assuré, le numéro de carte, l'expiration et les données à encoder.
4. Sur la station de personnalisation : **imprimez** et **encodez** la carte.
5. Contrôlez la carte imprimée : nom correctement orthographié, numéro lisible, marque conforme.
6. De retour dans le système : **Marquer comme écrite**. La carte devient active.
7. Remettez ou expédiez la carte, et enregistrez la remise.

> **Vérifiez l'orthographe du nom avant d'imprimer.** Une carte mal imprimée est une carte perdue et un client qui se sent mal traité.

## D.3 Émettre une carte virtuelle (QR)

**Menu : Clients → [client] → Émettre une carte virtuelle.**

Choisissez le mode de remise : **SMS** au numéro du client, **impression** sur les conditions particulières, ou **les deux**. Le QR est généré immédiatement et fonctionne sur n'importe quel terminal, y compris hors ligne.

À utiliser lorsque : le client attend sa carte physique, l'a perdue, ou vit loin d'un point de personnalisation. C'est aussi le moyen le plus rapide de rendre un nouveau client opérationnel le jour même de sa souscription.

## D.4 Bloquer, remplacer, renouveler

| Situation | Action | Effet |
|---|---|---|
| Carte perdue ou volée | **Bloquer** avec le motif | Immédiatement inutilisable ; le blocage est instantané côté serveur |
| Carte endommagée | **Remplacer** | Nouvelle carte liée à l'ancienne ; l'ancienne est définitivement morte |
| Carte arrivant à expiration | **Renouveler** | Nouvelle carte avec une nouvelle date d'expiration |
| Le client ajoute une police | **Mettre à jour la carte** | Réencoder, ou émettre une carte virtuelle actualisée |

Bloquer une carte ne bloque **jamais** les polices du client ni ses paiements — le client peut toujours payer par recherche manuelle ou par QR.

## D.5 Protection des données à la station

La station de personnalisation manipule des noms de clients et des données de cartes. Maintenez le local à accès contrôlé, ne laissez pas de fichiers de personnalisation sur le poste après usage, et ne sortez jamais de données de cartes des locaux de SUNU.

---

# PARTIE E — ADMINISTRATEUR (SUNU)

*Vous configurez la solution et gérez qui peut faire quoi.*

## E.1 Utilisateurs et profils

**Menu : Utilisateurs.**

Créer un utilisateur : identité et courriel → **attribuez exactement un profil** (Agent collecteur, Agent back-office, Superviseur, Agent cartes, Administrateur) → mot de passe provisoire remis séparément de l'identifiant → l'utilisateur le change à la première connexion.

> **Attribuez le profil minimal permettant à la personne de faire son travail.** Un agent back-office n'a pas besoin de droits de superviseur « au cas où ». Si quelqu'un a besoin d'une action supplémentaire occasionnelle, cela relève d'une demande au superviseur, pas d'une habilitation permanente.

**Départs — le jour même :** désactivez le compte (ne le supprimez jamais — la suppression romprait la piste d'audit), clôturez l'affectation du terminal, assurez-vous que toutes les espèces sont versées et confirmées, récupérez les cartes éventuelles.

**Chaque trimestre :** passez en revue la liste complète des comptes et habilitations avec chaque responsable de service, désactivez ce qui est inutilisé, et consignez que vous l'avez fait.

## E.2 Collecteurs

**Menu : Agents.** Créez le collecteur, affectez un terminal, fixez le plafond.

Fixer un plafond est un jugement de gestion :

| Trop bas | Trop élevé |
|---|---|
| Collecteur bloqué en permanence | Montant important exposé si le collecteur est malhonnête ou victime d'un vol |
| Déplacements inutiles pour verser | Contrôle affaibli |

Commencez prudemment — un plafond couvrant environ un à deux jours d'encaissement normal sur la tournée de ce collecteur — puis ajustez à partir des données réelles au bout d'un mois.

## E.3 Terminaux

**Menu : Terminaux.** Enregistrez chaque appareil avec son numéro de série, sa SIM, son alias et son modèle ; affectez-le à un collecteur ; gardez des terminaux de secours en stock. En cas de perte ou de vol : marquez-le, désactivez le compte du collecteur, remettez un terminal de secours.

## E.4 Produits

**Menu : Produits.** Pour chaque produit d'assurance : code, libellé français et anglais, périodicité de prime, règle de frais de police, modèle de reçu, et le code produit SUNULIFE.

Modifier le tarif d'un produit n'affecte que les encaissements futurs. **Ne supprimez jamais un produit qui porte des encaissements** — désactivez-le à la place.

## E.5 Frais, commissions et limites

La plateforme prend en charge des règles forfaitaires, en pourcentage et par paliers pour les frais de transaction et les commissions des collecteurs, définissables par produit et par type de transaction. Configurez-les avec la Direction Financière ; chaque modification est auditée et s'applique pour l'avenir.

## E.6 Notifications

**Menu : SMS.** Configurez le nom de l'expéditeur, surveillez le solde de crédits et choisissez les événements qui notifient l'assuré. Recommandé au minimum : **une confirmation SMS à l'assuré pour chaque prime encaissée** — c'est le contrôle le plus efficace de toute la solution contre un collecteur qui garderait les espèces.

## E.7 Ce que vous ne devez pas faire

- Ne vous attribuez pas les droits de confirmation des versements. Configuration et confirmation financière doivent rester en des mains différentes.
- Ne créez pas de comptes partagés ou génériques (« agent1 », « backoffice »). Chaque compte appartient à une personne nommément identifiée.
- Ne réutilisez pas le compte d'un employé parti pour son remplaçant. Créez-en un nouveau.

---

# PARTIE F — PROFIL DSI / TECHNIQUE

*Vous maintenez la plateforme en fonctionnement et les intégrations en bonne santé.*

## F.1 Périmètre

Configuration des environnements, intégrations et leurs identifiants, supervision technique, sauvegardes, livraisons et support de niveau 2. **Vous ne confirmez pas les versements** — le pouvoir technique ne doit pas égaler le pouvoir financier (Document 2 §5.2).

## F.2 Intégrations

**Menu : Configuration → Intégrations.**

| Intégration | Ce que vous gérez |
|---|---|
| **SUNULIFE** | Point d'entrée, authentification, mapping des champs, planification de la synchronisation, journal de synchronisation et rejeu |
| **Mobile Money** | Opérateur, identifiants, URL de rappel, rapprochement |
| **SMS** | Opérateur, expéditeur, crédits |

Les identifiants sont saisis une fois et ne sont plus réaffichés. Effectuez leur rotation au moins une fois par an et immédiatement en cas de suspicion, en suivant la procédure documentée (Document 2 §5.4).

## F.3 Contrôles quotidiens

- Sauvegarde nocturne terminée.
- Traitements asynchrones actifs ; aucune file qui s'accumule.
- Synchronisation SUNULIFE : dernière exécution réussie, nombre d'erreurs.
- Mobile Money : paiements en attente et état du rapprochement.
- Taux d'erreur et temps de réponse.
- Alertes de sécurité.

## F.4 Mensuel et trimestriel

**Mensuel :** analyse de vulnérabilité des dépendances ; application des correctifs dans la fenêtre convenue ; revue des accès des comptes privilégiés ; contrôle de la croissance du stockage.
**Trimestriel :** **test complet de restauration depuis sauvegarde dans un environnement vierge** — une sauvegarde jamais restaurée n'est pas une sauvegarde ; revue de la configuration des alertes ; revue de la piste d'audit à la recherche d'anomalies.

## F.5 Livraisons

Chaque livraison : testée en recette, approuvée par SUNU, déployée dans la fenêtre convenue, documentée dans un journal des changements, avec un retour arrière documenté. Ne déployez jamais directement en production. N'utilisez jamais de données réelles de production en recette.

## F.6 Support de niveau 2

| Symptôme | Premiers contrôles |
|---|---|
| Un terminal ne se synchronise pas | Agent actif ? Terminal affecté ? Clé d'API valide ? Limite de débit atteinte ? Journal de synchronisation |
| Paiements Mobile Money bloqués en attente | État de l'opérateur, accessibilité du rappel, vérification de signature, traitement de rapprochement |
| Synchronisation SUNULIFE en échec | Point d'entrée joignable, identifiants valides, erreurs de validation de charge utile dans le journal |
| Un export ne se termine jamais | Traitement asynchrone actif, espace disque, erreurs du traitement de rapport |
| Un utilisateur ne peut pas se connecter | Compte actif, non verrouillé, profil correct, dispositif MFA |

---

# PARTIE G — DÉPANNAGE (tous profils)

| Problème | Cause probable | Solution |
|---|---|---|
| Le terminal n'imprime pas | Papier, bourrage, capot ouvert, batterie | Rechargez le papier, débloquez, refermez le capot, rechargez. Puis **Réimprimer** |
| Carte non lue | Carte abîmée, passage trop rapide, mauvais sens | Maintenez-la à plat et immobile sur le lecteur. Si cela échoue encore, utilisez la recherche manuelle et signalez la carte |
| QR non scanné | Écran trop sombre, objectif sale, impression abîmée | Augmentez la luminosité du téléphone, nettoyez l'objectif, ou utilisez la recherche manuelle |
| Le GPS n'accroche pas | À l'intérieur, ciel peu dégagé | Sortez un instant ; si cela échoue encore, continuez — vous n'êtes pas bloqué |
| « Plafond atteint » | Vous détenez trop d'espèces | Versez (§A.8) |
| « Terminal non affecté » | Mauvais terminal, ou affectation non faite | Contactez l'administrateur |
| Le compteur de synchronisation ne se vide pas | Pas de réseau, ou problème serveur | Déplacez-vous en zone couverte. Si cela persiste plus d'une journée, appelez le support |
| Le Mobile Money reste en attente | Opérateur lent ou injoignable | Patientez ; n'encaissez pas deux fois. Cela se résout par le rapprochement |
| Export bloqué sur « Génération » | Congestion des traitements | Patientez quelques minutes ; si cela persiste, appelez la DSI |
| Compte verrouillé | Trop de tentatives erronées | Patientez, puis réessayez. Sinon, demandez une réinitialisation à l'administrateur |

**Quand vous appelez le support, ayez sous la main :** votre nom et votre profil, le numéro de série du terminal le cas échéant, l'heure exacte, la référence de l'opération ou le numéro de reçu, et le message d'erreur exact.

---

SUNU a souligné « l'importance du strict respect du calendrier pour le déploiement initial ». Cela mérite une réponse franche plutôt qu'optimiste.

### 2.1 Ce qui rend la date atteignable

- La solution est une **personnalisation d'une plateforme déjà en production**, non une construction nouvelle (Doc 1 §2.1, §4). Les agents, les terminaux, les rôles et habilitations, les clients, les cartes avec leur cycle de vie complet, les transactions avec frais et commissions, la piste d'audit, le SMS, les restitutions avec export Excel, le fonctionnement hors ligne du TPE, l'impression des reçus et la lecture/écriture NFC des cartes existent et fonctionnent aujourd'hui.
- La plateforme comporte déjà un **module d'affiliation volontaire et de cotisations périodiques** structurellement identique au modèle proposition → police → prime de SUNU. Il s'agit d'une adaptation, non d'une invention.
- Le pilote porte délibérément sur **15 terminaux dans un périmètre maîtrisé**, non sur un déploiement national.

### 2.2 Ce qui menace réellement la date

| # | Menace | Nature | Responsable |
|---|---|---|---|
| **1** | **Approvisionnement matériel** : 15 terminaux, 5 000 cartes, la station de personnalisation | Hors logiciel. Les délais dépendent du fournisseur et de la douane et ne se compriment pas en travaillant davantage | SUNU + fournisseur |
| **2** | **Enrôlement Mobile Money** auprès des opérateurs ou d'un agrégateur | Processus commercial et KYC chez un tiers ; généralement plusieurs semaines | SUNU |
| **3** | **API SUNULIFE** : existence, documentation, accès de test | Inconnue à ce jour (Doc 1, OP-1). Impossible à planifier tant que la réponse manque | SUNU / éditeur SUNULIFE |
| **4** | **Décision d'hébergement et mise à disposition des environnements** | Bloque l'environnement de recette, qui bloque tout l'aval | SUNU (Doc 1, OP-5) |
| **5** | **Disponibilité de SUNU pour la recette et la formation** durant les deux dernières semaines de septembre | La réception ne peut pas être déléguée au fournisseur | SUNU |
| **6** | **Décision sur la technologie de carte** (magnétique ou sans contact) | Change ce qui est commandé ; commander le mauvais produit coûte plus cher que le délai | SUNU (Doc 1, OP-3) |

**Quatre des six relèvent de SUNU.** Ce n'est pas une critique — c'est la réalité d'un projet d'intégration, et c'est pourquoi la section 6 liste des dépendances datées avec des responsables nommés.

### 2.3 La décision de cadrage qui protège la date

Plutôt que de tout risquer, le périmètre du pilote est délibérément resserré sur le **cœur du TdR**, les demandes complémentaires du courriel étant échelonnées sur octobre :

| Livré pour le pilote — 30 septembre | Livré durant octobre, en service pour novembre |
|---|---|
| Saisie de souscription avec photos de la proposition et de la CNIB, GPS | Encaissement Mobile Money |
| Frais de police et première prime, deux reçus | Carte virtuelle (QR) à l'échelle |
| Émission de carte physique et carte multi-polices | Synchronisation API SUNULIFE en lecture, phase 1 **(si OP-1 est tranché)** |
| Encaissement de prime par carte, sélection de police, reçu | Améliorations issues des retours du pilote |
| Plafond du collecteur, déclaration et confirmation des versements | Points de durcissement restants (Doc 2 §12) |
| Back-office : profils, habilitations, encaissements, exports | |
| **Export Excel pour SUNULIFE** (TdR Besoin 2) | |
| **Import en masse des clients SUNULIFE existants** (Doc 1 §8.4 phase 0) | |
| Points de sécurité bloquants H-1, H-4, H-6 (Doc 2 §12) | |

**Pourquoi ce découpage fonctionne.** Le pilote livre 100 % des besoins énoncés dans le TdR. Les ajouts du courriel — Mobile Money, QR, API SUNULIFE — sont de véritables exigences, mais aucun d'eux n'est nécessaire pour qu'un collecteur souscrive un client et encaisse une prime sur le terrain le 30 septembre. Vouloir tous les traiter à cette date mettrait le cœur en péril au profit de fonctions dépendant de tiers que nous ne maîtrisons pas.

**Point déterminant : l'import en masse de la phase 0 fait que l'exigence prioritaire de SUNU — que les agents voient les clients déjà présents dans SUNULIFE — est satisfaite dès le pilote même si l'API n'est pas disponible**, au moyen d'une extraction périodique. L'intention de l'exigence est honorée à la date prévue ; le mécanisme est amélioré ensuite.

Si SUNU préfère un autre découpage, c'est la conversation à tenir le 1er octobre, l'arbitrage étant alors explicite plutôt que découvert dans la dernière semaine de septembre.

## 5. Critères de réception et jalons go/no-go

### 5.1 Scénarios de réception en recette (M2)

Chaque scénario est exécuté par SUNU et signé.

| # | Scénario | Critère de réussite |
|---|---|---|
| T1 | Souscription complète avec photographies et GPS | Dossier complet et lisible au back-office avec tous les champs exigés par le TdR |
| T2 | Frais de police et première prime | Deux reçus distincts imprimés avec les montants exacts |
| T3 | Souscription entièrement hors ligne, puis reconnexion | Rien de perdu, rien de dupliqué |
| T4 | Émission de carte pour un assuré mono-police | Carte imprimée, encodée, active |
| T5 | Émission de carte pour un assuré **multi-polices** | Toutes les polices présentes sur la carte et affichées sur le terminal |
| T6 | Encaissement de prime par carte | Liste de polices correcte, reçu correct |
| T7 | Encaissement de prime par QR | Même résultat que T6 |
| T8 | Encaissement hors ligne puis synchronisation | Encaissement présent une fois et une seule |
| T9 | Plafond atteint | Le terminal bloque les nouveaux encaissements ; la souscription reste possible |
| T10 | Versement déclaré et confirmé | Solde réduit, terminal libéré |
| T11 | Versement avec écart | Écart consigné et signalé ; solde réduit du montant réel |
| T12 | Export Excel | Le fichier s'ouvre, contient tous les encaissements de la période, champs exploitables pour la saisie SUNULIFE |
| T13 | Import de phase 0 | Un client SUNULIFE existant est retrouvé par un collecteur sur le terrain |
| T14 | Profils et habilitations | Chaque profil ne peut faire que ce que permet le Doc 2 §5.2 — **tests négatifs compris** |
| T15 | Renvoi après expiration réseau | Aucun encaissement en double |
| T16 | Carte bloquée | Carte refusée immédiatement ; le client peut toujours payer par recherche ou par QR |
| T17 | Piste d'audit | Toute action sensible tracée avec acteur, horodatage et valeurs avant/après |
| T18 | Les deux langues | Chaque écran et chaque reçu corrects en français et en anglais |

### 5.2 Jalon G4 — go/no-go du pilote (27 septembre)

**Le GO exige la totalité des points suivants :**

- [ ] Recette signée par SUNU ; aucune anomalie bloquante ou critique ouverte
- [ ] Liste de contrôle sécurité (Doc 2 §18) signée — y compris les points bloquants **H-1, H-4, H-6**
- [ ] 15 terminaux en main, configurés, durcis, affectés à des collecteurs nommés
- [ ] Cartes et station de personnalisation opérationnelles ; au moins 20 cartes produites en test
- [ ] Collecteurs formés et briefings signés
- [ ] Personnel back-office et superviseurs formés
- [ ] Environnement de production opérationnel ; sauvegarde en fonctionnement ; **restauration testée**
- [ ] Données de phase 0 chargées et validées par SUNU
- [ ] Plafonds, produits, tarifs et comptes de versement paramétrés
- [ ] Procédure et contacts de support publiés des deux côtés
- [ ] Procédure de retour arrière documentée et comprise

**Si un point n'est pas satisfait :** un pilote partiel avec moins de collecteurs est préférable à un report intégral — il préserve l'échéance du 30 septembre sur des transactions réelles pendant que l'élément manquant est complété. C'est le repli recommandé, décidé au jalon G4 plutôt qu'improvisé.

### 5.3 Jalon M6 — go/no-go de production (28 octobre)

- [ ] Pilote exploité au moins 3 semaines sans incident critique
- [ ] Toutes les anomalies du pilote clôturées ou acceptées avec contournement
- [ ] Tous les points de durcissement (Doc 2 §12) clôturés
- [ ] Mobile Money en production **ou** formellement reporté par SUNU avec une date
- [ ] SUNULIFE phase 1 en production **ou** repli par fichiers accepté et en fonctionnement
- [ ] Rapprochement conforme pendant 3 semaines consécutives
- [ ] Documentation finale, en français, livrée
- [ ] Population d'utilisateurs élargie formée
- [ ] Second test de restauration réussi
- [ ] Modèle de support convenu pour la production

| **Pilote, reste d'octobre** | Heures ouvrées, canal dédié | Critique : 2 h · Élevée : 4 h · Moyenne : 1 jour ouvré |
| **Lancement production, deux premières semaines** | Renforcée | Critique : 1 h · Élevée : 4 h |
| **Production standard** | Heures ouvrées + astreinte pour le critique | Critique : 2 h · Élevée : 1 jour ouvré · Moyenne : 3 jours ouvrés |

| Gravité | Définition |
|---|---|
| **Critique** | Encaissement terrain impossible, ou perte de données |
| **Élevée** | Une fonction majeure indisponible sans contournement |
| **Moyenne** | Fonction dégradée, contournement existant |
| **Faible** | Cosmétique ou demande d'amélioration |

**Escalade :** niveau 1 support interne SUNU (administrateur formé) → niveau 2 technique Rhenium → niveau 3 direction de projet des deux côtés. Contacts publiés et affichés avant M3.

---

## 11. Retour arrière

| Situation | Action |
|---|---|
| Une livraison introduit une anomalie bloquante | Retour à la version précédente, documenté par livraison ; les encaissements déjà enregistrés ne sont pas affectés — le registre est en ajout seul |
| Le pilote ne peut pas fonctionner du tout | Les collecteurs reviennent aux carnets de reçus pour la zone concernée ; les encaissements saisis sur les terminaux sont récupérés et rapprochés ; le pilote est relancé après correction |
| Un terminal tombe en panne | Réaffecter le collecteur à un terminal de secours ; données non synchronisées récupérées depuis l'appareil d'origine |
| Corruption de données | Restauration depuis sauvegarde (RPO 15 min, RTO 4 h) ; les encaissements détenus sur les terminaux sont resynchronisés, l'idempotence empêchant toute duplication |

Les données de terrain ne sont jamais perdues par un retour arrière : les encaissements demeurent sur le terminal jusqu'à l'acquittement du serveur, et la contrainte de référence unique rend le renvoi sans danger.

| **Phase 3** | Extension du parc de terminaux au-delà de 15 ; zones supplémentaires | Selon le plan commercial de SUNU |
| **Phase 4** | Application mobile destinée aux assurés : carte virtuelle, historique des paiements, paiement de prime en libre-service | 2027 |
| **Phase 5** | Produits supplémentaires ; déclaration de sinistre sur le terrain ; dispositifs d'intéressement des collecteurs | 2027 |
