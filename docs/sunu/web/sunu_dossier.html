# PART A — COLLECTION AGENT (POS Terminal)

*You are the person in the field. You subscribe new clients and collect premiums. This part is your complete manual.*

## A.1 Your terminal

Your terminal is assigned to you personally and recorded against your name. You cannot work on someone else's terminal, and they cannot work on yours.

| What it has | What you use it for |
|---|---|
| Touch screen | Everything |
| Camera | Photographing the proposal and the client's CNIB |
| Card reader | Reading the client's SUNU card |
| Printer | Receipts |
| GPS | Recording where the subscription or collection took place |
| SIM / mobile data | Sending data to the back office |

**Before leaving in the morning:** terminal charged, paper roll loaded plus a spare, log in successfully once while you still have good network.

## A.2 Logging in

〔SCREEN: login〕

1. Turn on the terminal, open the SUNU application.
2. Enter your **username**.
3. Enter your **PIN**.
4. Press **Log in**.

The home screen shows: your name, your terminal, **your current uncollected balance**, and your remaining margin before your cap.

**The terminal locks itself** after a period of inactivity. Re-enter your PIN to continue — nothing is lost.

**Working without network.** You can log in and work offline for a bounded period after your last online login. Beyond that, the terminal asks you to reconnect once. Plan to be in coverage at least once a day.

## A.3 Home screen and what the colours mean

〔SCREEN: home〕

```
  ┌────────────────────────────────────┐
  │  OUEDRAOGO Ali · TPE-BF-007        │
  │                                    │
  │  Uncollected:  185 000 FCFA        │  ← what you are holding
  │  Cap:          250 000 FCFA        │  ← your ceiling
  │  ████████████████░░░░  74%         │
  │                                    │
  │  ┌──────────┐   ┌──────────┐      │
  │  │ NEW      │   │ COLLECT  │      │
  │  │ SUBSCR.  │   │ PREMIUM  │      │
  │  └──────────┘   └──────────┘      │
  │  ┌──────────┐   ┌──────────┐      │
  │  │ PAY IN   │   │ MY DAY   │      │
  │  └──────────┘   └──────────┘      │
  │                                    │
  │  ⟳ 3 items waiting to sync         │
  └────────────────────────────────────┘
```

| Colour of the bar | Meaning | What you should do |
|---|---|---|
| **Green** | Well below your cap | Carry on |
| **Orange** | Approaching your cap | Plan your pay-in today |
| **Red** | Cap reached — **collection blocked** | Pay in now (§A.8). You can still take new subscriptions |

The **⟳ counter** shows items not yet sent to the back office. It clears itself when you have network. It is normal to see it in the field.

## A.4 New subscription (with first premium)

*Use this when a prospect signs a new policy.*

**Before touching the terminal:** fill in the paper proposal, have the client sign it, and have their CNIB to hand. The paper document remains the legal contract — the terminal captures and transmits it.

〔SCREEN: subscription stepper〕

**Step 1 — Product.** Select the product (e.g. Micro-Quiétude, Micro Épargne Retraite).

**Step 2 — Proposal number.** Type the number printed on the paper proposal. Type it carefully — it is how the back office and SUNULIFE will match this subscription.

**Step 3 — Client identity.** Last name, first name(s), date of birth, phone number, CNIB number. If the client says they are already a SUNU customer, use **Search existing client** first — if they are found, their details fill in automatically and no duplicate is created.

**Step 4 — Photographs.** Three photographs:
1. the **signed proposal**;
2. the **CNIB, front**;
3. the **CNIB, back**.

Hold the terminal steady, fill the frame with the document, avoid shadow and glare. After each shot the terminal shows you the result: press **Retake** if any text is unreadable. *A blurred photo means the back office cannot process the file and someone will call you about it.*

**Step 5 — Location.** The terminal captures GPS automatically. Wait for the green indicator. If GPS cannot fix — inside a building, for example — step outside briefly; if it still fails, continue: the subscription is not blocked.

**Step 6 — Policy costs.** Enter the amount received for the policy costs → **Collect** → **the terminal prints receipt no. 1**. Give it to the client.

**Step 7 — First premium.** Enter the amount of the first premium → **Collect** → **the terminal prints receipt no. 2**. Give it to the client.

> **These are two separate receipts and both must be handed over.** One for the policy costs, one for the first premium. This is a formal SUNU requirement.

**Step 8 — Confirmation.** A summary appears. If you have network the file is sent immediately; if not it joins the queue and departs on its own later. **Either way the client is properly registered and holds valid receipts.**

**What happens next.** The back office reviews the file, validates it, and orders the client's card. The client is told how they will receive it.

## A.5 Collecting a premium from an existing client

*This is your most frequent operation.*

〔SCREEN: collect premium〕

**Step 1 — Identify the client.** Three ways:

| Method | How | When |
|---|---|---|
| **SUNU card** | Press **Collect premium**, hold the card against the reader | Normal case |
| **QR code (virtual card)** | Press **Scan QR**, frame the code on the client's phone or on their policy schedule | Client has no physical card |
| **Manual search** | Press **Search**, enter policy number, name or phone | Card lost or unreadable |

**Step 2 — Check the client.** The screen shows the insured's name and their **list of active policies**. Check the name aloud with the client.

**Step 3 — Choose the policy.** Tap the policy being paid. If the client has several policies, ask them which one — do not guess. The screen shows the expected premium and the next due date.

**Step 4 — Enter the amount.** Type the amount received. The expected premium is suggested; you can change it if the client pays a different amount.

**Step 5 — Choose the payment method.**

| Method | What happens |
|---|---|
| **Cash** | You take the money. **It counts against your cap.** |
| **Mobile Money** | Enter the client's number. **The client receives a prompt on their own phone and enters their own PIN.** Wait for confirmation on your screen. **This does not count against your cap** — the money goes straight to SUNU |

> **Never ask a client for their Mobile Money PIN, and never type it yourself.** The client enters it on their own handset. Anyone asking for that PIN is committing fraud.

**Step 6 — Receipt.** The terminal prints the receipt. **Hand it to the client.** For Mobile Money, the receipt prints **only after the payment is confirmed** — if it is not confirmed, no receipt, and no money has moved.

## A.6 Reprinting a receipt

**My day → find the collection → Reprint.** The copy is marked **DUPLICATA**. Every reprint is recorded. Use it when the printer jams or the paper tears — not to produce a second "original".

## A.7 Following your day

**My day** shows: number of collections, total collected, split cash / Mobile Money, list of the day's operations, and items still to be synchronised.

Check it before finishing your day. **The cash in your bag must equal the cash total shown.** If it does not, do not go home without telling your supervisor.

## A.8 Paying in (releasing your cap)

*Do this when the bar goes orange, and always before it goes red.*

**Step 1.** Physically deposit the money: either at the bank into the designated SUNU account, or at a SUNU cash office.

**Step 2.** On the terminal: **Pay in** →
- amount deposited;
- method (bank deposit / cash office);
- bank reference or slip number;
- **photograph of the deposit slip** (strongly recommended — it speeds up confirmation).

**Step 3.** Submit. Status becomes **Declared, awaiting confirmation**.

**Step 4.** The supervisor checks it against the bank statement or the cash count and confirms. Your balance drops, the bar goes green, and collection is unblocked. This is usually the same day; it depends on when the bank statement is available.

> **Declaring a pay-in does not by itself release your cap.** Only the supervisor's confirmation does. So pay in *before* you are blocked, not after.

## A.9 Working without network

Everything below works offline:

| Works offline | Needs network |
|---|---|
| Logging in (within the offline period after your last online login) | The very first login on a new terminal |
| Full subscription capture, photos, GPS | Searching for a client not in your local cache |
| Collecting from a card or QR (client in cache) | Mobile Money payments |
| Printing receipts | Confirming a pay-in |
| Consulting your day | |

The ⟳ counter shows what is waiting. When you have network again, everything leaves automatically. **Do not reinstall the application and do not clear the application data while items are waiting** — you would destroy collections that have not yet reached the back office. If the counter refuses to clear for more than a day, call support.

## A.10 What you must never do

- Never collect money without printing a receipt.
- Never keep a client's card.
- Never ask for a client's Mobile Money PIN.
- Never lend your terminal or your PIN.
- Never exceed the time allowed to pay in.
- Never promise a client anything about their contract — that is the back office's job, not yours.

## A.11 If something goes wrong

| Situation | What to do |
|---|---|
| Terminal lost or stolen | **Call your supervisor immediately.** The account is disabled remotely. There is no cash on the device |
| Terminal broken | Report it; a spare is assigned. Collections not yet sent are recovered if the device is repaired |
| Card unreadable | Use manual search; report the card so a replacement is issued |
| Client contests a payment | Reprint the receipt, note the reference, refer to the back office. Do not repay from your own pocket |
| Money collected but the client left before the receipt printed | Note the reference, call the supervisor the same day. **Do not delete anything** |
| Wrong amount entered | Do not attempt to fix it yourself. Report it: the back office issues a correction entry |

## A.12 Pocket card — to print and keep

 │  SUNU — COLLECTION AGENT · QUICK REFERENCE      │
 ├────────────────────────────────────────────────┤
 │  NEW CLIENT                                     │

 │   product → proposal no. → identity →           │

 │   red = blocked, pay in now                     │

# PART B — BACK-OFFICE AGENT

*You process what comes in from the field: subscription files, collections, exports, client records.*

## B.1 Logging in and your dashboard

Open the back-office address in your browser, enter your credentials. 〔SCREEN: dashboard〕

Your dashboard shows: today's collections and totals, **proposals awaiting review** (your main queue), active collectors and their cap status, exceptions to handle, and the last exports.

## B.2 Reviewing subscription files — your core task

**Menu: Subscriptions → Awaiting review.** Each line is a file sent from the field.

For each file:

1. Open it. On the left, the field data; on the right, the photographs.
2. **Check the photographs.** Is the proposal readable? Is it signed? Is the CNIB readable on both sides?
3. **Check consistency.** Does the name on the proposal match the name entered? Does the proposal number match the paper document? Does the product match?
4. **Check the payments.** Policy costs and first premium present, and consistent with the product's tariff?
5. **Check for a duplicate.** The system flags a possible existing client by CNIB or phone. If it is the same person, use **Merge** rather than creating a second record.

Then decide:

| Decision | Effect |
|---|---|
| **Accept** | Policy created, card issuance queued (Part D), file closed |
| **Request correction** | Returned to the collector with your comment (e.g. "CNIB photo unreadable") |
| **Reject** | File closed with a mandatory reason. **The collections already made are not cancelled** — money received stays recorded. Any refund is a separate business decision |

> **Never accept a file whose photographs you cannot read.** The photograph is the proof of subscription. Ask for a correction — it costs the collector two minutes and saves a dispute later.

## B.3 Consulting collections

**Menu: Collections.** Filter by date, collector, product, policy, payment method, amount, status.

Each collection shows: date and time, collector, terminal, insured, policy, amount, method, receipt number, unique reference, GPS position where captured, and the SUNULIFE transmission status.

Useful views: *Today*, *This collector*, *Mobile Money pending*, *Not yet transmitted to SUNULIFE*.

## B.4 Excel export — recording into SUNULIFE

*This is the operation the TdR requires explicitly.*

1. **Menu: Reports → Collections.**
2. Set the period and any filters (collector, product, payment method).
3. Choose the **Excel (XLSX)** format.
4. **Generate**. The report is produced in the background — you can keep working.
5. When status shows **Ready**, click **Download**.

The file contains one row per collection with the fields SUNULIFE requires: date, product, policy number, proposal number, insured, amount, payment method, receipt number, collector reference, terminal, unique reference.

**Good practice:** export **once a day at a fixed hour**, over a period that does not overlap the previous export, and record in SUNULIFE the same day. Keep the file. When the automatic SUNULIFE integration is activated (Document 1 §8.4), this export remains available as a control and a fallback — it does not disappear.

## B.5 Managing clients and policies

**Menu: Clients.** Search by name, phone, CNIB, policy or card number.

A client record shows identity, documents, policies, cards (physical and virtual), and full collection history.

| Action | Note |
|---|---|
| Correct identity data | Audited; correct a typing error, do not overwrite a different person |
| Add a document | For a replacement CNIB, for example |
| Merge two records | Only when it is certainly the same person; the operation is traced and reversible only by IT |
| Request a card | Sends the request to the card officer (Part D) |
| Issue a virtual card (QR) | Immediate; sent by SMS or printed |

**Data protection.** You see personal data because your job requires it. Do not export it beyond what you need, do not send it outside SUNU, and do not discuss it outside your role. Every export is logged with your name.

## B.6 Exception queues

**Menu: Exceptions.**

| Queue | What it means | What you do |
|---|---|---|
| **Mobile Money pending** | Payment neither confirmed nor failed | Wait for the reconciliation; if still pending after 24 h, escalate to IT |
| **SUNULIFE rejected** | The push was refused | Read the error, correct the data if it is a data problem, resubmit; escalate if it is technical |
| **Possible duplicate** | Two client records look like the same person | Compare and merge, or dismiss |
| **Unmatched collection** | Collection with no valid policy link | Identify the correct policy and re-link |

Handle these **daily**. They do not resolve themselves and they grow.

---

# PART C — SUPERVISOR / CONTROLLER

*You are the financial control. Your signature releases collectors and confirms that SUNU's money has arrived.*

## C.1 Your dashboard

Shows: **pay-ins awaiting confirmation** (your priority), all collectors with cap utilisation, collectors blocked, variance alerts, ageing of uncollected balances, day and week totals.

## C.2 Confirming a pay-in — your critical responsibility

**Menu: Pay-ins → Awaiting confirmation.**

For each declaration you see: collector, declared amount, method, bank reference, deposit-slip photo, declaration date and time, and the collector's balance before and after.

**Procedure:**

1. **Verify against the source.** Bank deposit → find the credit on the bank statement. Cash office → obtain the counting record from the cashier.
2. **Compare** the amount actually received with the amount declared.
3. Then:

| Case | Action |
|---|---|
| Amounts match | **Confirm**. The balance drops, the terminal is released |
| Received *less* than declared | **Confirm the real amount.** The variance is recorded against the collector and reported. Inform your line manager the same day |
| Received *more* than declared | Confirm the real amount; note the reason |
| Nothing received | **Reject** with a reason. The collector stays blocked. Escalate immediately |

> **Confirm only against evidence.** Confirming without seeing the bank credit or the counting record means declaring that SUNU has money it may not have. Above a configured amount, a second approver is required — this protects you as much as it protects SUNU.

## C.3 Monitoring caps

**Menu: Collectors → Caps.**

| Signal | Reading | Action |
|---|---|---|
| Collector permanently near their cap | Cap too low, or paying in too rarely | Review the cap, or the pay-in rhythm |
| Balance ageing beyond the policy limit | Cash held too long | Call the collector today |
| Collector blocked for more than a day | Blocked work | Chase the pay-in or the confirmation |
| Collections with no matching pay-in over a long period | **Warning sign** | Investigate at once |

## C.4 Fraud indicators to watch weekly

| Indicator | Possible reading |
|---|---|
| Gap in receipt numbering on a terminal | Suppressed or destroyed receipts |
| Collections clustered at one GPS point far from any client | Fictitious collections |
| Collections recorded at implausible hours | Irregular practice |
| Repeated variances on one collector's pay-ins | Diversion |
| Frequent reprints on the same collections | Duplicate receipts handed out |
| Many corrections requested by one collector | Poor practice or manipulation |

The system raises these automatically. **Treat an alert as a question to ask, not an accusation.** Most have an innocent explanation; the ones that do not must be escalated in writing the same day.

## C.5 Reconciliation

**Weekly:** total collected − total confirmed pay-ins = sum of uncollected balances. If it does not balance, escalate to IT with the period concerned.

**Daily for Mobile Money:** platform total versus the provider's settlement report versus the amount credited to the bank account. Any discrepancy goes to the exception queue.

---

# PART D — CARD ISSUANCE OFFICER

*You produce and issue SUNU cards, physical and virtual.*

## D.1 Card stock

**Menu: Cards → Stock.** Blank cards are recorded and each card number is traceable from stock to insured.

| Task | Frequency |
|---|---|
| Record a new delivery of blanks | On receipt |
| Physical count against the system record | Monthly |
| Report any discrepancy | Immediately — it is a security incident |

## D.2 Issuing a physical card

**Menu: Cards → Requests.** Each request comes from an accepted subscription.

1. Open the request. Check the insured's name and the **list of policies** — the card must carry every active policy of that insured, as the TdR requires.
2. **Allocate a card** from stock. The system assigns the number and the expiry.
3. **Generate the personalisation file** — this contains the SUNU branding block, the insured's last and first name, the card number, the expiry, and the data to encode.
4. On the personalisation station: **print** and **encode** the card.
5. Check the printed card: name spelled correctly, number legible, branding correct.
6. Back in the system: **Mark as written**. The card becomes active.
7. Hand over or dispatch the card, and record the handover.

> **Check the spelling of the name before printing.** A misprinted card is a wasted card and a client who feels badly treated.

## D.3 Issuing a virtual card (QR)

**Menu: Clients → [client] → Issue virtual card.**

Choose the delivery: **SMS** to the client's number, **print** on the policy schedule, or **both**. The QR is generated immediately and works on any terminal, including offline.

Use it when: the client is waiting for their physical card, has lost it, or lives far from a personalisation point. It is also the fastest way to get a new client operational on the day they subscribe.

## D.4 Blocking, replacing, renewing

| Situation | Action | Effect |
|---|---|---|
| Card lost or stolen | **Block** with the reason | Immediately unusable; blocking is instant server-side |
| Card damaged | **Replace** | New card linked to the old one; the old card permanently dead |
| Card expiring | **Renew** | New card with a new expiry |
| Client adds a policy | **Update card** | Re-encode, or issue an updated virtual card |

Blocking a card **never** blocks the client's policies or their payments — the client can still pay via manual search or a QR.

## D.5 Data protection at the station

The personalisation station handles client names and card data. Keep the room access-controlled, do not leave personalisation files on the workstation after use, and never take card data out of SUNU premises.

---

# PART E — ADMINISTRATOR (SUNU)

*You configure the solution and manage who can do what.*

## E.1 Users and profiles

**Menu: Users.**

Creating a user: identity and e-mail → **assign exactly one profile** (Collection Agent, Back-Office Agent, Supervisor, Card Officer, Administrator) → temporary password issued separately from the username → the user changes it on first login.

> **Assign the minimum profile that lets the person do their job.** A back-office agent does not need supervisor rights "just in case". If someone needs an occasional extra action, that is a request to the supervisor, not a permanent permission.

**Departures — the same day:** disable the account (never delete it — deletion would break the audit trail), close the terminal assignment, ensure all cash is paid in and confirmed, recover any cards.

**Every quarter:** review the full list of accounts and permissions with each department head, disable what is unused, and record that you did it.

## E.2 Collectors

**Menu: Agents.** Create the collector, assign a terminal, set the cap.

Setting a cap is a business judgement:

| Too low | Too high |
|---|---|
| Collector blocked constantly | Large amount exposed if the collector is dishonest or robbed |
| Wasted travel to pay in | Weak control |

Start conservatively — a cap covering roughly one to two days of normal collection for that collector's round — and adjust from real data after a month.

## E.3 Terminals

**Menu: Terminals.** Register each device with its serial number, SIM, alias and model; assign it to a collector; keep spares in stock. On loss or theft: mark it, disable the collector's account, issue a spare.

## E.4 Products

**Menu: Products.** For each insurance product: code, French and English label, premium frequency, policy-cost rule, receipt template, and the SUNULIFE product code.

Changing a product's tariff affects future collections only. **Never delete a product that has collections** — deactivate it instead.

## E.5 Fees, commissions and limits

The platform supports fixed, percentage and tiered rules for transaction costs and for collector commissions, definable per product and per transaction type. Configure these with Finance; every change is audited and applies going forward.

## E.6 Notifications

**Menu: SMS.** Configure the sender name, monitor the credit balance, and choose which events notify the insured. Recommended as a minimum: **an SMS confirmation to the insured for every premium collected** — it is the most effective control in the whole solution against a collector pocketing cash.

## E.7 What you must not do

- Do not give yourself pay-in confirmation rights. Configuration and financial confirmation must stay in different hands.
- Do not create shared or generic accounts ("agent1", "backoffice"). Every account belongs to one named person.
- Do not reuse a departed employee's account for their replacement. Create a new one.

---

# PART F — IT / TECHNICAL PROFILE

*You keep the platform running and the integrations healthy.*

## F.1 Scope

Environment configuration, integrations and their credentials, technical monitoring, backups, releases, and level-2 support. **You do not confirm pay-ins** — technical power must not equal financial power (Document 2 §5.2).

## F.2 Integrations

**Menu: Configuration → Integrations.**

| Integration | What you manage |
|---|---|
| **SUNULIFE** | Endpoint, authentication, field mapping, sync schedule, sync log and replay |
| **Mobile Money** | Provider, credentials, callback URL, reconciliation |
| **SMS** | Provider, sender, credits |

Credentials are entered once and are not displayed again. Rotate them at least annually and immediately on any suspicion, following the documented procedure (Document 2 §5.4).

## F.3 Daily checks

- Overnight backup completed.
- Queue workers running; no queue backing up.
- SUNULIFE sync: last successful run, error count.
- Mobile Money: pending payments and reconciliation status.
- Error rate and response times.
- Security alerts.

## F.4 Monthly and quarterly

**Monthly:** dependency vulnerability scan; apply patches in the agreed window; review privileged account access; check storage growth.
**Quarterly:** **full restore test from backup into a clean environment** — a backup that has never been restored is not a backup; review the alert configuration; review the audit trail for anomalies.

## F.5 Releases

Every release: tested in UAT, approved by SUNU, deployed in the agreed window, changelogged, with a documented rollback. Never deploy directly to production. Never use real production data in UAT.

## F.6 Level-2 support

| Symptom | First checks |
|---|---|
| A terminal cannot synchronise | Agent active? Terminal assigned? API key valid? Rate limit hit? Sync log |
| Mobile Money payments stuck pending | Provider status, callback reachability, signature verification, reconciliation job |
| SUNULIFE sync failing | Endpoint reachable, credentials valid, payload validation errors in the sync log |
| Export never completes | Queue worker running, disk space, report job errors |
| A user cannot log in | Account active, not locked, correct profile, MFA device |

---

# PART G — TROUBLESHOOTING (all profiles)

| Problem | Likely cause | Solution |
|---|---|---|
| Terminal will not print | Paper, jam, cover open, battery | Reload paper, clear the jam, close the cover, charge. Then **Reprint** |
| Card not read | Card damaged, moved too fast, wrong side | Hold it flat and still against the reader. If it still fails, use manual search and report the card |
| QR not scanned | Screen too dark, dirty lens, damaged print | Raise the phone's brightness, clean the lens, or use manual search |
| GPS will not fix | Indoors, poor sky view | Step outside for a moment; if it still fails, continue — you are not blocked |
| "Cap reached" | You are holding too much cash | Pay in (§A.8) |
| "Terminal not assigned" | Wrong terminal, or assignment not made | Contact the administrator |
| Sync counter will not clear | No network, or a server problem | Move to coverage. If it persists more than a day, call support |
| Mobile Money stays pending | Provider slow or unreachable | Wait; do not collect twice. It resolves by reconciliation |
| Export stuck at "Generating" | Queue congestion | Wait a few minutes; if it persists, call IT |
| Account locked | Too many wrong attempts | Wait, then retry. Otherwise ask the administrator for a reset |

**When you call support, have ready:** your name and profile, the terminal serial number if applicable, the exact time, the operation reference or receipt number, and the exact error message.

| Term | Meaning |
|---|---|
| **Cap** | The maximum amount of collected cash a collector may hold before being required to pay in |
| **CNIB** | Carte Nationale d'Identité Burkinabè — the national identity card |
| **Collection** | A premium or policy-cost payment received from an insured |
| **DUPLICATA** | The mark printed on a reprinted receipt |
| **Insured** | The person covered by the policy |
| **Pay-in** | The act of handing collected cash to the bank or the SUNU cash office |
| **Policy costs** | The charges payable at subscription, separate from the premium |
| **POS / TPE** | The payment terminal used in the field |
| **Premium** | The amount the insured pays for their cover |
| **Proposal** | The signed subscription form, and the record created from it |
| **Reference (unique)** | The identifier generated by the terminal for each operation; it makes double-counting impossible |
| **Reference period** | The period a premium covers (e.g. September 2026) |
| **SUNULIFE** | SUNU's core business software, master of customers and contracts |
| **Sync / synchronisation** | The sending of data held on the terminal to the back office |
| **UAT** | User acceptance testing — the phase where SUNU tests before go-live |
| **Virtual card** | The QR code that identifies an insured in place of a physical card |

## 2. Honest Assessment of the Schedule

SUNU emphasised "the importance of strictly adhering to the schedule for the initial deployment". That deserves a straight answer rather than an optimistic one.

### 2.1 What makes the date achievable

- The solution is a **customisation of a platform already running in production**, not a new build (Doc 1 §2.1, §4). Agents, terminals, roles and permissions, clients, cards with a full lifecycle, transactions with fees and commissions, audit trail, SMS, reporting with Excel export, offline POS operation, receipt printing and NFC card read/write all exist and work today.
- The platform already contains a **voluntary-insurance enrolment and periodic-contribution module** structurally identical to SUNU's proposal → policy → premium model. This is adaptation, not invention.
- The pilot is deliberately **15 terminals in a controlled perimeter**, not a national rollout.

### 2.2 What genuinely threatens the date

| # | Threat | Nature | Owner |
|---|---|---|---|
| **1** | **Hardware procurement**: 15 terminals, 5 000 cards, the personalisation station | Outside software. Lead times are supplier- and customs-driven and cannot be compressed by working harder | SUNU + supplier |
| **2** | **Mobile Money onboarding** with the operators or an aggregator | Commercial and KYC process at a third party; typically several weeks | SUNU |
| **3** | **SUNULIFE API**: existence, documentation, test access | Unknown today (Doc 1, OP-1). Cannot be planned until answered | SUNU / SUNULIFE editor |
| **4** | **Hosting decision and environment provisioning** | Blocks the UAT environment, which blocks everything downstream | SUNU (Doc 1, OP-5) |
| **5** | **SUNU availability for UAT and training** in the last two weeks of September | Acceptance cannot be delegated to the supplier | SUNU |
| **6** | **Card technology decision** (magnetic versus contactless) | Changes what is ordered; ordering the wrong thing costs more than the delay | SUNU (Doc 1, OP-3) |

**Four of the six are on SUNU's side.** That is not a criticism — it is the reality of an integration project, and it is why section 6 lists dated dependencies with named owners.

### 2.3 The scoping decision that protects the date

Rather than risk everything, the pilot scope is deliberately narrowed to the **TdR core**, with the e-mail's additional requests phased across October:

| Delivered for the pilot — 30 September | Delivered during October, live for November |
|---|---|
| Subscription capture with proposal and CNIB photographs, GPS | Mobile Money collection |
| Policy costs and first premium, two receipts | Virtual card (QR) at scale |
| Physical card issuance and multi-policy card | SUNULIFE Phase 1 read-only API sync **(if OP-1 is answered)** |
| Premium collection by card, policy selection, receipt | Refinements from pilot feedback |
| Collector cap, pay-in declaration and confirmation | Remaining hardening items (Doc 2 §12) |
| Back office: profiles, permissions, collections, exports | |
| **Excel export for SUNULIFE** (TdR Need 2) | |
| **Bulk import of existing SUNULIFE customers** (Doc 1 §8.4 Phase 0) | |
| Blocking security items H-1, H-4, H-6 (Doc 2 §12) | |

**Why this split works.** The pilot delivers 100% of the TdR's stated needs. The e-mail's additions — Mobile Money, QR, SUNULIFE API — are real requirements, but none of them is required for a collector to subscribe a client and collect a premium in the field on 30 September. Attempting all of them by that date would put the core at risk for features that depend on third parties we do not control.

**Critically, the Phase 0 bulk import means SUNU's priority requirement — that agents see customers who already exist in SUNULIFE — is met at the pilot even if the API is not available**, using a periodic extract. The intent of the requirement is honoured on time; the mechanism is upgraded later.

If SUNU prefers a different split, this is the conversation to have on 1 October, with the trade-off explicit rather than discovered in the last week of September.

## 11. Rollback

| Situation | Action |
|---|---|
| A release introduces a blocking defect | Roll back to the previous version, documented per release; collections already recorded are unaffected — the ledger is append-only |
| The pilot cannot operate at all | Collectors revert to receipt books for the affected zone; collections captured on the terminals are recovered and reconciled; the pilot is relaunched after correction |
| A terminal fails | Reassign the collector to a spare; unsynchronised data recovered from the original device |
| Data corruption | Restore from backup (RPO 15 min, RTO 4 h); collections held on terminals are re-synchronised, idempotency preventing duplication |

Field data is never lost by a rollback: collections stay on the terminal until the server acknowledges them, and the unique-reference constraint makes re-sending safe.

## 1. Objet et périmètre

### 1.1 Objet

Le présent document décrit l'architecture technique globale et détaillée de la solution mobile de collecte de primes destinée à SUNU Assurances Vie Burkina Faso. Il constitue l'architecture de référence sur laquelle la solution est construite, testée, auditée sur le plan de la sécurité et réceptionnée.

Il répond au point 2 du courriel d'exigences de SUNU (« un document présentant l'architecture technique globale et détaillée de la solution ») et au point 1 (« intégration avec SUNULIFE et récupération des données existantes »), traité ici comme une préoccupation architecturale de premier rang et non comme un ajout ultérieur.

### 1.2 Périmètre

**Dans le périmètre**

- L'application TPE Android exécutée sur les terminaux de terrain (saisie de souscription, encaissement de primes, impression de reçus, lecture/écriture de carte, lecture de QR, initiation Mobile Money).
- La plateforme back-office web (gestion des utilisateurs et des profils, gestion des assurés et des polices, suivi des encaissements, plafonds et versements des collecteurs, restitutions et export Excel).
- La chaîne d'émission et de personnalisation des cartes (carte physique et carte virtuelle QR).
- La couche d'intégration vers SUNULIFE, les opérateurs Mobile Money et le SMS.
- L'hébergement, le réseau et la topologie de déploiement.

**Hors périmètre du présent document** (traité ailleurs)

- Les contrôles et procédures de sécurité — Document 2.
- Les procédures d'exploitation pour les utilisateurs finaux — Document 3.
- La planification, les jalons et les responsabilités — Document 4.
- Les conditions commerciales, la fourniture matérielle des terminaux, des cartes et de la station de personnalisation — couvertes par l'offre commerciale.

### 1.3 Public visé

La DSI et les Opérations de SUNU, la Direction Générale de SUNU (sections 2 et 3), l'éditeur ou l'équipe de maintenance de SUNULIFE (section 8), et l'équipe de réalisation.

## 2. Contexte métier — ce que le système doit faire

L'architecture découle directement des quatre besoins énoncés dans le TdR, complétés par les quatre ajouts fonctionnels demandés dans le courriel du 21 août.

| Réf. | Exigence | Origine | Conséquence architecturale |

| R2 | Photographier la proposition signée et la CNIB, transmettre au back-office avec la référence de l'agent, le produit, le numéro de proposition, le nom de l'assuré et les coordonnées GPS | TdR Besoin 1 | Chaîne de traitement des images, file hors ligne, rattachement des métadonnées, file de revue back-office |

### 2.1 Pourquoi l'échéance de septembre est tenable

La solution n'est **pas construite à partir de zéro**. Il s'agit de la personnalisation d'une plateforme d'agency banking existante et déjà en production (application TPE Android + back-office web Laravel) qui met déjà en œuvre : les agents, les terminaux, l'affectation terminal-agent, les unités d'exploitation, les rôles et habilitations, les clients, les comptes, les cartes avec leur cycle d'émission et de statut, les transactions avec frais et commissions, la journalisation d'activité et d'audit, le SMS, les restitutions avec export Excel, et une couche d'intégration configurable vers les systèmes bancaires centraux.

Point déterminant : la plateforme comporte déjà un **module d'assurance sociale volontaire** (affiliation d'assurés volontaires CNSS et encaissement de cotisations périodiques) dont le modèle de données est structurellement identique à celui dont SUNU a besoin — un enregistrement d'affiliation portant l'agent, le terminal, le statut, les données d'identité, une charge utile de formulaire JSON souple et les pièces jointes, plus un enregistrement de cotisation portant le montant, la période de référence, la périodicité et un lien vers l'affiliation et la transaction financière. Le triptyque « proposition d'assurance → police → prime » de SUNU a exactement la même forme que « affiliation → adhésion → cotisation ».

Le pilote de septembre est donc une **adaptation métier de code éprouvé**, et non une construction nouvelle. La section 4 énonce explicitement, composant par composant, ce qui est réutilisé, ce qui est étendu et ce qui est neuf.

### 3.2 Principes architecturaux

1. **Le terrain d'abord, tolérant au hors-ligne.** Un collecteur sur un marché ou dans un village doit pouvoir travailler quand le réseau est mauvais. Toute opération de terrain écrit d'abord localement, produit immédiatement un reçu imprimé, puis se synchronise. Une perte de connectivité ne fait jamais perdre un encaissement.
2. **Le back-office est le référentiel de l'encaissement ; SUNULIFE demeure le référentiel du contrat.** La solution n'invente jamais une police. Soit elle la reçoit de SUNULIFE (R9), soit elle crée une *proposition* qui devient une police une fois confirmée par SUNULIFE. On évite ainsi deux vérités contradictoires sur le contrat d'un client.
3. **Une colonne vertébrale financière unique.** Les encaissements en espèces, par Mobile Money et identifiés par carte produisent tous le même enregistrement de `transaction`, ne différant que par l'instrument de paiement. Les restitutions, les plafonds, les commissions et la remontée vers SUNULIFE n'ont ainsi qu'un seul chemin de code.
4. **L'intégration derrière des adaptateurs.** SUNULIFE, chaque opérateur Mobile Money et la passerelle SMS se placent derrière une interface interne. Changer d'opérateur, ou voir SUNULIFE modifier son API, relève de la configuration et de l'adaptateur, non d'une refonte. La plateforme applique déjà ce schéma pour les systèmes bancaires centraux (pilote configurable + identifiants par institution + mapping des champs) ; SUNULIFE le réutilise.
5. **Tout est imputable.** Chaque souscription, encaissement, versement et émission de carte porte l'agent, le terminal, l'horodatage et — lorsque l'appareil le permet — les coordonnées GPS. C'est à la fois une exigence du TdR et le socle de la maîtrise de la fraude.
6. **Dégrader, pas arrêter.** Si SUNULIFE est injoignable, l'encaissement continue et l'export Excel du Besoin 2 du TdR reste disponible. Si le Mobile Money est en panne, l'encaissement en espèces continue. Aucune dépendance externe ne peut interrompre la collecte des primes.

### 3.3 Socle technologique

| Couche | Technologie | Justification |
|---|---|---|
| Application TPE | Android (Java), SDK min. 19, matériel Telpo / Feitian | Correspond aux terminaux du TdR ; base de code déjà en production ; accès natif au lecteur NFC, à l'imprimante thermique, à l'appareil photo et au GPS |
| Stockage local TPE | SQLite | File hors ligne et caches locaux |
| Application back-office | PHP 8 / Laravel 9, interface Blade | Base de code déjà en production ; personnalisation rapide ; large vivier de maintenance dans la région |
| Base de données | MySQL 8 (InnoDB) | Intégrité transactionnelle, éprouvée à cette échelle |
| Style d'API | REST / JSON sur HTTPS | Simplicité, facilité de diagnostic, adaptée au TPE |
| Traitements asynchrones | Files Laravel (pilote base de données, Redis en option) | Synchronisation SUNULIFE, SMS, exports et traitement d'images hors du chemin de requête |
| Restitutions/export | Génération serveur en XLSX/CSV | Le Besoin 2 du TdR exige explicitement Excel |
| Carte | Carte sans contact/NFC, et personnalisation à piste magnétique telle que spécifiée par le TdR | Section 7 |
| Carte virtuelle | Justificatif QR signé (JWS/HMAC) | Section 7.3 |
| Hébergement | VPS/VM Linux, Nginx + PHP-FPM | Section 10 |

## 5. Architecture des données

### 5.1 Entités principales

```
business_unit
   │
   ├── user ──── role ──── permission
   │
   ├── agent (collecteur) ─┬── agent_terminal ──── terminal
   │                       └── collector_cap / collector_balance      [neuf]
   │
   ├── client (assuré) ────┬── client_document (photo proposition, CNIB)
   │                       ├── proposal              [adapté]
   │                       ├── policy                [neuf]
   │                       └── card ────── card_policy_link           [neuf]
   │                                └── virtual_card_credential       [neuf]
   │
   ├── insurance_product        [neuf]
   │
   ├── premium_collection ─── transaction ─── transaction_type
   │        [adapté]              [réutilisé]
   │
   ├── pay_in ──── pay_in_lines  [neuf]
   │
   ├── momo_payment              [neuf]
   │
   ├── sunulife_sync_log         [neuf]
   │
   ├── report (export asynchrone)  [réutilisé]
   └── activity_log (audit)        [réutilisé]
```

### 5.2 Principales tables nouvelles ou adaptées

**`insurance_product`** — `code`, `name_fr`, `name_en`, `family` (micro-assurance / standard), `default_premium_frequency`, `policy_cost_rule`, `receipt_template`, `sunulife_product_code`, `is_active`.

**`proposal`** — `business_unit_id`, `agent_id`, `terminal_id`, `client_id`, `insurance_product_id`, `proposal_number` (issu du formulaire papier, unique par unité), `status` (saisie → transmise → en revue → acceptée → rejetée), `subscribed_at`, `latitude`, `longitude`, `form_data` (JSON), `proposal_image_path`, `id_document_front_path`, `id_document_back_path`, `sunulife_policy_number` (renseigné à l'acceptation), horodatages. *Reprend directement la table d'affiliation existante, qui porte déjà l'agent, le terminal, le statut, les données d'identité, le JSON `form_data` et les chemins de documents.*

**`policy`** — `business_unit_id`, `client_id`, `insurance_product_id`, `policy_number`, `sunulife_policy_id`, `status` (active / suspendue / en déchéance / résiliée), `effective_date`, `premium_amount`, `premium_frequency`, `next_due_date`, `outstanding_balance`, `source` (`sunulife` | `local_proposal`), `synced_at`. Unicité sur (`business_unit_id`, `policy_number`).

**`premium_collection`** — `business_unit_id`, `policy_id`, `proposal_id` (pour une première prime), `agent_id`, `terminal_id`, `transaction_id`, `amount`, `collection_kind` (`policy_cost` | `first_premium` | `recurring_premium`), `reference_period`, `payment_frequency`, `payment_instrument` (`cash` | `momo` | `bank`), `reference` (unique, générée sur l'appareil), `latitude`, `longitude`, `collected_at`, `receipt_number`, `metadata` (JSON), `sunulife_pushed_at`.

**`collector_cap`** — `agent_id`, `cap_amount`, `warning_threshold_pct`, `currency`, `is_active`.
**`collector_balance`** — `agent_id`, `uncollected_amount`, `last_pay_in_at`, `is_blocked`, `blocked_at`. Tenue de façon transactionnelle à chaque encaissement et à chaque versement confirmé.

**`pay_in`** — `agent_id`, `declared_amount`, `method` (`bank_deposit` | `cash_office`), `bank_reference`, `deposit_slip_path`, `declared_at`, `status` (`declared` | `confirmed` | `rejected`), `confirmed_by`, `confirmed_at`, `confirmed_amount`, `variance`, `notes`. La confirmation libère le terminal.

**`card_policy_link`** — `card_id`, `policy_id`, `slot_index`. Répond à l'exigence explicite du TdR selon laquelle une carte doit conserver plusieurs polices pour un même assuré.

**`virtual_card_credential`** — `client_id`, `card_id` (nullable), `credential_id`, `payload_hash`, `signature`, `key_version`, `issued_at`, `expires_at`, `revoked_at`.

**`momo_payment`** — `premium_collection_id`, `provider`, `provider_reference`, `msisdn`, `amount`, `status`, `initiated_at`, `finalised_at`, `callback_payload` (JSON), `reconciliation_status`.

**`sunulife_sync_log`** — `direction` (`pull` | `push`), `entity`, `entity_id`, `request_payload`, `response_payload`, `http_status`, `status`, `attempts`, `last_error`, `synced_at`.

### 5.3 Idempotence et génération des références

Toute opération issue du terrain porte une **référence unique générée par le client**, construite à partir du numéro de série du terminal, de l'identifiant de l'agent, d'un compteur monotone et d'un horodatage. Le back-office impose l'unicité de cette référence. Un renvoi après expiration réseau ne peut donc pas créer un double encaissement. C'est le contrôle d'intégrité des données le plus important d'un système de collecte tolérant au hors-ligne, et il est appliqué au niveau de la base de données, pas seulement dans le code applicatif.

### 5.4 Conservation des données

| Donnée | Durée | Remarque |
|---|---|---|
| Transactions financières et encaissements | 10 ans | Conservation assurantielle et comptable |
| Images de propositions et de pièces d'identité | 10 ans, archivage en stockage froid après 2 ans | Maîtrise des volumes |
| Piste d'audit | 5 ans | |
| Journaux de requêtes API | 12 mois | |
| Gabarits biométriques (si activés) | Durée de la relation + 1 an | Voir Document 2 |
| Journaux de session et journaux techniques | 90 jours | |

## 6. Flux fonctionnels (niveau 3)

### 6.1 Flux A — Souscription et première prime (TdR Besoin 1)

```
COLLECTEUR                   TERMINAL TPE                  BACK-OFFICE            SUNULIFE
    │                             │                             │                     │
    │ remplit la proposition      │                             │                     │
    │ le client signe             │                             │                     │
    │                             │                             │                     │
    ├─ « Nouvelle souscription » ►│                             │                     │
    │                             │ choisit le produit          │                     │
    │                             │ saisit le n° de proposition │                     │
    │                             │ saisit l'identité           │                     │
    │                             │ photographie la proposition │                     │
    │                             │ photographie la CNIB (2 f.) │                     │
    │                             │ capture le GPS              │                     │
    │                             │ ── enregistre en local ───► │                     │
    │                             │                             │                     │
    ├─ encaisse frais de police ─►│ imprime le REÇU n°1 (frais) │                     │
    ├─ encaisse la 1re prime ────►│ imprime le REÇU n°2 (prime) │                     │
    │                             │                             │                     │
    │                             │ ── envoie dès connexion ──► │ crée la proposition │
    │                             │                             │ + 2 encaissements   │
    │                             │                             │ + 2 transactions    │
    │                             │                             │                     │
    │                             │                             │ revue back-office   │
    │                             │                             │ ── pousse la prop. ►│
    │                             │                             │ ◄── n° de police ───┤
    │                             │                             │ crée la police      │
    │                             │                             │ met la carte en file│
```

**Données transmises avec la proposition, conformément au TdR :** les références de l'agent collecteur, le produit souscrit, le numéro de proposition figurant sur le document physique, les nom et prénoms de l'assuré, les coordonnées géographiques du lieu de souscription.

**Données transmises avec chaque paiement, conformément au TdR :** le nom du produit, le numéro de proposition, les références de l'agent collecteur, le montant encaissé, la date, l'heure et, si possible, les coordonnées géographiques.

Les deux reçus sont des documents distincts portant des numéros distincts, le TdR exigeant un reçu pour les frais de police et un reçu séparé pour la première prime.

### 6.2 Flux B — Encaissement d'une prime récurrente par carte (TdR Besoin 2)

```
ASSURÉ          COLLECTEUR       TERMINAL TPE              BACK-OFFICE
   │                │                  │                        │
   ├─ présente carte►│                 │                        │
   │                ├─ pose la carte ─►│ lit l'UID de la carte  │
   │                │                  ├─ recherche par UID ───►│
   │                │                  │◄── assuré + polices ───┤
   │                │                  │    actives             │
   │                │                  │                        │
   │                │◄─ liste polices ─┤  (mise en cache locale │
   │                │                  │   pour le hors-ligne)  │
   │                ├─ choisit police ►│                        │
   │                ├─ saisit montant ►│ contrôle vs prime due  │
   │                ├─ espèces ou      │                        │
   │                │   Mobile Money   │                        │
   │                │                  │ [si MoMo → section 9]  │
   │                │                  │                        │
   │◄─── REÇU ──────┼──────────────────┤ imprime le reçu        │
   │                │                  ├─ poste l'encaissement ►│ encaissement +
   │                │                  │                        │ transaction
   │                │                  │                        │ solde collecteur +
   │                │                  │◄─ état du plafond ─────┤ contrôle plafond
```

Si le terminal est hors ligne, la liste des polices est servie depuis le cache local (rafraîchi à chaque synchronisation réussie), le reçu est imprimé immédiatement et l'encaissement est mis en file. L'assuré n'est jamais éconduit à cause du réseau.

### 6.3 Flux C — Plafond du collecteur et versement (TdR Besoin 2)

```
À chaque encaissement : collector_balance.uncollected_amount += montant

  non versé < seuil d'alerte          → fonctionnement normal
  alerte ≤ non versé < plafond        → bandeau d'avertissement sur tous les écrans
  non versé ≥ plafond                 → le TPE BLOQUE LES NOUVEAUX ENCAISSEMENTS
                                         (la saisie de souscription reste permise)

COLLECTEUR                    TPE               BACK-OFFICE            SUPERVISEUR
    │                          │                     │                      │
    ├─ dépose en banque OU ────┼─────────────────────┼──────────────────────┤
    │  remet les espèces à la caisse                 │                      │
    ├─ déclare le versement ──►│ montant, mode,      │                      │
    │                          │ réf. bancaire, photo│                      │
    │                          │ du bordereau ──────►│ pay_in (déclaré)     │
    │                          │                     ├─ notifie ───────────►│
    │                          │                     │                      │
    │                          │                     │◄── confirme montant ─┤
    │                          │                     │  (ou rejette avec    │
    │                          │                     │   écart consigné)    │
    │                          │                     │ solde -= confirmé    │
    │                          │◄── terminal libéré ─┤ is_blocked = false   │
    ├─ reprend la collecte ───►│                     │                      │
```

La confirmation est une **action contrôlée** : elle est soumise à habilitation, intégralement auditée, et peut être configurée pour exiger une validation à deux personnes (maker-checker) au-delà d'un montant paramétrable. Voir le Document 2, section sur la séparation des tâches.

### 6.4 Flux D — Émission de carte (TdR Besoins 1 et 3)

```
BACK-OFFICE (proposition acceptée)
   │
   ├─ crée la police
   ├─ affecte une carte du stock (statut : non affectée → inactive)
   ├─ rattache la ou les polices à la carte
   ├─ génère le FICHIER DE PERSONNALISATION :
   │     • bloc de marque SUNU Assurances Vie
   │     • nom et prénoms de l'assuré
   │     • numéro de carte
   │     • date d'expiration
   │     • données encodées : UID carte ↔ référence assuré ↔ liste des polices
   │
   ▼
AGENT CARTES à la station de personnalisation
   ├─ imprime la carte personnalisée
   ├─ encode la carte
   ├─ marque la carte comme ÉCRITE au back-office
   ├─ remet ou expédie la carte à l'assuré
   ▼
   statut de la carte → active
```

La carte porte un **identifiant, ni monnaie ni donnée personnelle sensible**. La liste des polices faisant foi réside toujours au back-office ; ce qui est écrit sur la carte permet à un terminal d'identifier rapidement l'assuré et de travailler hors ligne. Justification et analyse de la menace au Document 2, section 7.

### 6.5 Flux E — Synchronisation SUNULIFE

Voir la section 8.

## 7. Architecture des cartes (physique et virtuelle)

### 7.1 Carte physique

- **Support :** carte aux couleurs de SUNU, personnalisée avec les informations de SUNU Assurances Vie et les nom et prénoms de l'assuré, conformément au TdR.
- **Numérotation :** le back-office génère le numéro de carte à partir d'un préfixe par unité et d'une séquence de longueur paramétrable ; l'expiration découle de la validité par défaut configurée (mécanisme de paramétrage des cartes existant).
- **Données écrites :** numéro de série/UID de la carte, référence de l'assuré et liste des emplacements de polices. Le support multi-polices est explicite dans le TdR (« si l'assuré a plusieurs polices, nous souhaitons que la carte puisse conserver cette information »).
- **Cycle de vie :** non affectée → inactive → active → (bloquée | expirée | remplacée). Le blocage consigne un motif et un horodatage ; le remplacement consigne la chaîne vers la nouvelle carte. Déjà implémenté.
- **Stock :** les 5 000 cartes sont gérées en stock au back-office ; chaque carte passe de « non affectée » à « affectée » lorsqu'elle est rattachée à un assuré.

### 7.2 Choix de la technologie de carte (point ouvert OP-3)

Le TdR mentionne une « carte magnétique ». Deux options se présentent, et nous recommandons la seconde :

| | Piste magnétique | Sans contact / NFC |
|---|---|---|
| Coût par carte | Plus faible | Légèrement supérieur |
| Résistance aux conditions de terrain | Faible — la piste s'use et se démagnétise | Bonne |
| Stockage multi-polices sur la carte | Très limité (environ 100 caractères exploitables) | Confortable |
| Sécurité | Clonable sans difficulté, aucune authentification | Prend en charge l'authentification mutuelle et des clés par carte |
| Compatibilité TPE sur les terminaux visés | Oui | Oui — les terminaux intègrent déjà un lecteur NFC dans la solution existante |
| Recommandation | | **Préférée** |

**Recommandation :** cartes sans contact. La piste magnétique ne peut pas porter une charge utile multi-polices significative et n'offre aucune protection contre le clonage. Si SUNU préfère des cartes hybrides (imprimées + piste + puce), l'architecture le permet ; le contenu encodé et le fichier de personnalisation sont identiques.

### 7.3 Carte virtuelle — QR Code (courriel §4)

Une carte virtuelle est un **justificatif signé**, non la photographie d'un numéro.

```
Charge utile QR (compacte, base64url) :
{
  "v":   1,                       version du schéma
  "cid": "SUNU-BF-00012345",      identifiant du justificatif
  "ins": "CLI-000987",            référence de l'assuré
  "nm":  "OUEDRAOGO Awa",         nom pour confirmation à l'écran
  "pol": ["P-2026-0043","P-2026-0044"],   références de polices
  "iat": 1756598400,              émis le
  "exp": 1788134400,              expiration
  "kid": "sunu-2026-k1"           version de la clé de signature
}
+ signature détachée (HMAC-SHA256 ou ECDSA P-256)
```

Propriétés :

1. **Vérifiable hors ligne.** Le TPE détient la clé publique (ou la clé HMAC partagée dans son coffre) et valide la signature sans réseau. Un QR contrefait est rejeté sur l'appareil.
2. **Révocable.** Une liste de révocation est poussée vers les terminaux à chaque synchronisation. La révocation est immédiate au back-office et effective sur le terminal à sa prochaine synchronisation.
3. **Limitée dans le temps.** Les justificatifs expirent et sont réémis, ce qui borne la fenêtre d'exploitation d'un QR divulgué.
4. **Non monétaire.** Le QR identifie l'assuré ; il n'autorise rien. Le paiement exige toujours la session authentifiée du collecteur et, si SUNU l'active, le code ou la biométrie de l'assuré.
5. **Diffusion.** Imprimé sur les conditions particulières, envoyé par lien SMS, ou affiché dans une future application destinée aux assurés. Aucun matériel requis — c'est ce qui en fait le canal économique pour un assuré ayant perdu sa carte ou vivant loin d'un point de personnalisation.

La carte physique et la carte virtuelle résolvent vers la **même identité d'assuré** ; le TPE les traite comme deux lecteurs vers une seule recherche.

## 8. Architecture d'intégration SUNULIFE (courriel §1 — exigence prioritaire)

SUNU a indiqué qu'une part importante de ses clients existe déjà dans SUNULIFE et a demandé que la solution récupère régulièrement, via API, les données clients à jour et les informations de polices, et que cela soit pris en compte dès la conception de l'architecture. La présente section constitue la réponse architecturale et, tout autant, la **liste de ce dont nous avons besoin de la part de SUNU** pour la réaliser.

### 8.1 Principes d'intégration

1. **SUNULIFE fait foi pour l'identité de l'assuré et les contrats.** La solution reflète, elle ne possède pas.
2. **La solution fait foi pour les événements d'encaissement terrain.** SUNULIFE les reçoit.
3. **Aucun couplage bloquant.** L'indisponibilité de SUNULIFE dégrade la fraîcheur des données, jamais la disponibilité de l'encaissement.
4. **Tout échange est journalisé et rejouable.** `sunulife_sync_log` consigne la requête, la réponse, le statut et les tentatives ; tout élément en échec peut être rejoué sans dupliquer un événement financier (clés d'idempotence, section 5.3).
5. **L'export Excel reste disponible en permanence**, en tant que repli contractuel du Besoin 2 du TdR. L'automatisation supprime le travail manuel ; elle ne supprime pas l'option manuelle.

### 8.2 Surface d'intégration — ce dont nous avons besoin de SUNULIFE

| # | Sens | Capacité | Objet | Fréquence |
|---|---|---|---|---|
| S1 | Lecture | **Recherche / consultation client** par numéro national (CNIB), numéro de police, téléphone ou numéro client | Identification terrain d'un assuré existant ; éviter les doublons | À la demande + delta nocturne |
| S2 | Lecture | **Delta du référentiel client** — clients créés ou modifiés depuis un horodatage | Maintenir le miroir local à jour | Nocturne (paramétrable) |
| S3 | Lecture | **Liste des polices d'un client** — numéro, produit, statut, date d'effet, montant de prime, périodicité, prochaine échéance, solde restant dû | Alimenter la carte et l'écran de sélection de police du TPE | Delta nocturne + à la demande |
| S4 | Lecture | **Catalogue produits** — codes et libellés | Aligner les références produits | Hebdomadaire |
| S5 | Écriture | **Notification d'encaissement de prime** — numéro de police, montant, date de valeur, numéro de reçu, référence du collecteur, instrument de paiement, clé d'idempotence unique | Mise à jour automatique des encaissements (TdR Besoin 4) | Quasi temps réel, mise en file |
| S6 | Écriture | **Nouvelle souscription / proposition** — numéro de proposition, produit, identité de l'assuré, première prime, frais de police, documents | Créer le contrat dans SUNULIFE et retourner le numéro de police | À l'acceptation back-office |
| S7 | Lecture | **Accusé de réception / statut de comptabilisation** d'un encaissement transmis | Rapprochement ; preuve de la bonne prise en compte | Interrogation ou rappel (callback) |

**Note de réutilisation.** La plateforme met déjà en œuvre exactement ce schéma d'adaptateur pour les systèmes bancaires centraux : une définition de système externe configurable avec URL de base, stratégie d'authentification (JWT bearer, HTTP basic, OAuth password), identifiants détenus séparément par institution, et **mapping des champs de requête et de réponse avec transformations**, par type de transaction. SUNULIFE devient un pilote dans ce cadre. C'est pourquoi S1–S7 peuvent être livrés rapidement *une fois l'API documentée* — la tuyauterie existe.

**Règles de conflit.**
- Un champ client ou police diverge entre le miroir et SUNULIFE → SUNULIFE l'emporte, la valeur précédente est consignée dans la piste d'audit.
- Un assuré créé localement est ensuite rapproché d'un client SUNULIFE (par CNIB ou téléphone) → les enregistrements sont fusionnés, la référence locale est conservée comme alias, les encaissements sont réaffectés.
- Un encaissement transmis à SUNULIFE et rejeté → l'encaissement reste valide et rapproché localement, signalé dans une file d'anomalies back-office pour traitement par l'agent back-office. Une somme déjà encaissée n'est jamais annulée par un échec d'intégration.

### 8.4 Phasage (le chemin pragmatique vers l'échéance de septembre)

| Phase | Contenu | Échéance |
|---|---|---|
| **Phase 0 — dès maintenant** | Export Excel pour saisie manuelle dans SUNULIFE, exactement comme le prévoit le Besoin 2 du TdR. **Import en masse ponctuel** du portefeuille clients et polices existant à partir d'une extraction SUNULIFE (CSV/XLSX), afin que les agents de terrain voient immédiatement les clients existants | Pilote, septembre 2026 |
| **Phase 1** | Intégration en lecture seule : S1, S3 à la demande ; S2, S4 en delta planifié | Production, novembre 2026 |
| **Phase 2** | Intégration en écriture : S5, S6, S7 | Après lancement, conformément au Besoin 4 du TdR |

La phase 0 est déterminante : elle signifie que **l'exigence de SUNU — que les agents voient les clients existants — est satisfaite dès le pilote même si l'API n'est pas encore disponible**, au moyen d'une extraction périodique. Cela retire SUNULIFE du chemin critique de l'échéance de septembre tout en honorant l'intention de l'exigence.

### 8.5 Informations requises de SUNU / de l'éditeur de SUNULIFE

Voici le questionnaire à renseigner avant ou lors de la réunion du 1er octobre 2026. Chaque ligne sans réponse constitue un risque de planning.

**Technique**
1. SUNULIFE expose-t-il une API aujourd'hui ? REST/JSON, SOAP/XML, ou uniquement base de données / fichiers ?
2. Existe-t-il une documentation d'API, un fichier WSDL/OpenAPI, ou une collection Postman ?
3. Quelle authentification est utilisée — clé d'API, OAuth 2.0, JWT, TLS mutuel, liste d'IP autorisées ?
4. SUNULIFE est-il hébergé chez SUNU, au niveau du groupe SUNU, ou chez l'éditeur ? Dans quel pays ?
5. Est-il joignable depuis notre environnement d'hébergement, ou un VPN / lien privé est-il requis ?
6. Existe-t-il des limitations de débit ou des fenêtres de maintenance ?
7. Existe-t-il une instance de test/recette, et quand l'accès peut-il être ouvert ?

**Fonctionnel**
8. Qu'est-ce qui identifie de façon unique un client dans SUNULIFE — numéro client, CNIB, ou une combinaison ?
9. Quel est le vocabulaire exact des statuts de police (active, en déchéance, suspendue, résiliée…) ?
10. Quels sont les codes produits de Micro-Quiétude et de Micro Épargne Retraite ?
11. Pour un paiement de prime, quels champs SUNULIFE exige-t-il pour comptabiliser correctement un reçu ?
12. SUNULIFE renvoie-t-il une confirmation de comptabilisation ou une référence de reçu que nous puissions conserver ?
13. Volumes approximatifs : nombre de clients, nombre de polices actives, encaissements quotidiens attendus ?

**Organisationnel**
14. Qui est le contact technique SUNULIFE (éditeur ou équipe interne) ?
15. Une demande de changement ou une autorisation contractuelle est-elle nécessaire auprès de l'éditeur pour ouvrir l'API, et quel en est le délai ?
16. Qui valide le mapping des données côté SUNU ?

**Si la réponse à la question 1 est « aucune API n'existe » :** l'architecture bascule sur un **échange de fichiers documenté** — dépôt sécurisé planifié (SFTP) des extractions en entrée et des fichiers d'encaissement en sortie, dans un format convenu avec SUNU. Ce mode est pleinement pris en charge et ne modifie aucune autre partie de la conception ; seul l'adaptateur change.

## 9. Architecture Mobile Money (courriel §4)

### 9.1 Conception indépendante de l'opérateur

La solution ne code en dur aucun opérateur Mobile Money. Une interface interne unique est mise en œuvre par un adaptateur par opérateur :

```
   TPE  ──►  BACK-OFFICE  ──►  PaymentGateway (interface)
                                    │
              ┌─────────────────────┼─────────────────────┐
              ▼                     ▼                     ▼
       OrangeMoneyAdapter    MoovMoneyAdapter     AggregatorAdapter
                                                  (un seul contrat,
                                                   les deux opérateurs)
```

Opérations : `initiateCollection`, `checkStatus`, `handleCallback`, `reconcile`, `refund` (lorsque l'opérateur le permet).

### 9.2 Flux d'encaissement

```
Le collecteur choisit « Mobile Money » → saisit le numéro (MSISDN) de l'assuré
   │
   ├─► le back-office crée momo_payment (statut : initié) + clé d'idempotence
   ├─► l'adaptateur appelle l'API d'encaissement de l'opérateur
   │
   ├─► l'assuré reçoit une invite USSD/push et saisit son code sur SON propre téléphone
   │
   ├─► rappel de l'opérateur ──► back-office (signature vérifiée, IP source contrôlée)
   │       OU interrogation du statut si aucun rappel n'est disponible
   │
   ├─ SUCCÈS  → premium_collection + transaction créés, reçu imprimé,
   │            solde du collecteur NON augmenté (l'argent va à SUNU, pas au collecteur)
   ├─ ÉCHEC   → rien de financier enregistré, le collecteur peut réessayer ou prendre les espèces
   └─ DÉLAI   → paiement laissé « en attente », résolu par le traitement de rapprochement ;
                le reçu n'est imprimé qu'après confirmation
```

**Point de conception qui compte au quotidien :** une prime Mobile Money **n'augmente pas** le solde non versé du collecteur, car celui-ci ne détient jamais ces espèces. Seuls les encaissements en espèces consomment le plafond. Le Mobile Money devient ainsi la soupape naturelle lorsqu'un collecteur approche de son plafond loin d'une banque — un bénéfice opérationnel direct pour SUNU.

### 9.3 Direct ou agrégateur

| Critère | Direct (Orange Money + Moov Money) | Agrégateur |
|---|---|---|
| Intégrations à réaliser | 2 | 1 |
| Contrats commerciaux | 2, chacun avec son propre délai d'enrôlement | 1 |
| Coût par transaction | Tarif opérateur uniquement | Tarif opérateur + marge de l'agrégateur |
| Règlement | Directement sur les portefeuilles/comptes opérateurs de SUNU | Via l'agrégateur, un flux de règlement unique |
| Délai jusqu'à la première transaction | Plus long — l'enrôlement opérateur est la contrainte | Plus court |
| Couverture des deux opérateurs | Oui | Oui |
| Risque de dépendance | Réparti | Concentré sur l'agrégateur |

**Recommandation au vu du calendrier :** démarrer avec un agrégateur pour sécuriser la mise en production de novembre, en conservant l'interface d'adaptateur afin qu'une migration ultérieure vers des intégrations opérateurs directes se réduise à un changement d'adaptateur et de circuit de règlement, et non à une refonte. SUNU décide ; l'architecture prend en charge l'une, l'autre, et les deux simultanément.

**Décision attendue de SUNU (OP-4) :** quelle voie, et quelle entité détient le compte marchand. Le délai d'enrôlement auprès des opérateurs est le principal risque externe pesant sur l'échéance de novembre — voir le registre des risques du Document 4.

### 9.4 Rapprochement

Un traitement quotidien compare, par opérateur : les transactions enregistrées par la plateforme, le rapport de règlement de l'opérateur et les montants crédités sur le compte de SUNU. Les écarts sont remontés dans une file d'anomalies avec indicateur d'ancienneté. Aucun encaissement Mobile Money n'est considéré comme définitif tant qu'il n'apparaît pas dans le fichier de règlement de l'opérateur.

Le pilote fonctionne confortablement sur un serveur applicatif unique (4 vCPU / 8 Go) avec un serveur de base de données distinct (4 vCPU / 16 Go) et environ 500 Go de stockage. La topologie ci-dessus s'étend horizontalement par ajout de nœuds applicatifs et de traitement derrière la couche TLS, sans changement d'architecture.

### 10.4 Lieu d'hébergement (point ouvert OP-5)

Décision attendue de SUNU : hébergement au Burkina Faso, ailleurs dans la zone UEMOA, ou en Europe. Ce choix influe sur la latence pour le parc de TPE, les obligations de résidence des données, le chemin réseau vers SUNULIFE et la disposition des opérateurs Mobile Money à autoriser l'environnement. Analyse au Document 2, section sur la résidence des données.

### 10.5 Disponibilité, sauvegarde et continuité

| Objectif | Valeur |
|---|---|
| Disponibilité du service (back-office) | 99,5 % mensuel, hors maintenance annoncée |
| Disponibilité terrain (encaissement possible) | ~100 % — le mode hors ligne rend l'encaissement indépendant du back-office |
| RPO (perte de données maximale) | 15 minutes sur la base de données (expédition des binlogs) ; 0 pour les encaissements terrain, conservés sur l'appareil jusqu'à acquittement |
| RTO (délai maximal de rétablissement) | 4 heures |
| Sauvegardes | Complète quotidienne + binlog continu ; chiffrées ; conservées 30 jours ; archive mensuelle conservée 12 mois ; **test de restauration chaque trimestre** |

## 11. Exigences non fonctionnelles

| Domaine | Exigence |
|---|---|
| **Fonctionnement hors ligne** | Saisie complète de souscription et encaissement de prime sans réseau ; synchronisation automatique à la reconnexion ; aucune perte de données ; aucun double enregistrement |
| **Performance** | Transition d'écran TPE < 1 s ; lecture de carte → affichage de la liste des polices < 2 s en ligne, < 500 ms depuis le cache ; pages de liste back-office < 2 s à 100 000 encaissements ; export Excel d'un mois généré de façon asynchrone et téléchargeable |
| **Langues** | Français (principal) et anglais sur le TPE et au back-office |
| **Devise** | XOF, sans décimales à l'affichage ; montants stockés avec 2 décimales |
| **Ergonomie de terrain** | Grandes zones tactiles, fort contraste, lisible en plein soleil, tolérant à une faible littératie (icônes + libellés français) |
| **Autonomie** | Une journée complète d'encaissement sur une charge en usage normal |
| **Impression** | Toute opération financière produit un reçu imprimé ; tout reçu peut être réimprimé dans la journée avec une mention « DUPLICATA » explicite |
| **Auditabilité** | Toute création/modification/suppression sur une entité sensible est consignée avec acteur, horodatage et valeurs avant/après |
| **Maintenabilité** | Configuration plutôt que code : produits, plafonds, frais, modèles de reçus, mappings de champs et habilitations sont paramétrables par un administrateur sans livraison logicielle |

## 1. Objet, périmètre et démarche

### 1.1 Objet

Le présent document décrit les mécanismes et procédures de sécurité protégeant la solution mobile de collecte de primes et les données qu'elle traite : qui peut faire quoi, comment l'argent et les données d'identité sont protégés, comment la solution se comporte en cas d'attaque ou de défaillance, et ce que SUNU doit faire au plan opérationnel pour la maintenir sûre.

### 1.2 Périmètre

| Dans le périmètre | Hors périmètre |
|---|---|
| Application TPE et parc de terminaux | Réseau bureautique interne et postes de travail de SUNU |
| Application web back-office et API REST | Sécurité interne propre à SUNULIFE (responsabilité SUNU/éditeur) |
| Base de données, stockage de fichiers, sauvegardes | Sécurité interne des opérateurs Mobile Money |
| Intégrations : SUNULIFE, Mobile Money, SMS | Sécurité physique des locaux de SUNU |
| Chaîne d'émission des cartes (physique et virtuelle) | Validité juridique de la proposition papier |
| Procédures de sécurité opérationnelles pour le personnel SUNU | |

### 1.3 Démarche et déclaration de transparence

La solution est la personnalisation d'une plateforme déjà en production pour des services financiers. C'est un avantage : les contrôles décrits ici sont pour l'essentiel des contrôles *en fonctionnement*, non des promesses.

Cela signifie aussi que la plateforme porte des choix d'implémentation préexistants qui **ne conviennent pas au déploiement de production d'un assureur** et qui sont corrigés dans le cadre du présent projet. La section 12 les énumère explicitement, avec le correctif et l'échéance, plutôt que de les taire. La DSI d'un assureur les trouvera ; les déclarer d'emblée est la seule position défendable, et c'est ainsi que ce projet traite la sécurité de bout en bout.

### 1.4 Référentiels de référence

La conception s'aligne, sans revendiquer de certification, sur :

- **ISO/IEC 27001:2022** — management de la sécurité de l'information, utilisé comme taxonomie de contrôles en section 15.
- **ISO/IEC 27002** — guide de mise en œuvre.
- **PCI-DSS v4.0** — utilisé comme *référence de conception* pour le traitement des cartes et des paiements. À noter : la solution ne stocke **aucun justificatif de paiement par carte ni aucune donnée de carte bancaire** ; les cartes émises sont des cartes d'identification d'assuré. Le périmètre complet de PCI-DSS ne s'applique donc pas, mais ses contrôles sur la gestion des clés, la journalisation et la segmentation réseau sont adoptés comme bonnes pratiques.
- **OWASP ASVS 4.0 niveau 2** et **OWASP Top 10 (2021)** — vérification de la sécurité applicative.
- **OWASP MASVS** — sécurité des applications mobiles.
- **Loi n°001-2021/AN portant protection des personnes à l'égard du traitement des données à caractère personnel (Burkina Faso)** et le contrôle de la **Commission de l'Informatique et des Libertés (CIL)** — données personnelles.
- **Code CIMA** et exigences **BCEAO** applicables aux opérations d'assurance et à l'acceptation de monnaie électronique dans la zone UEMOA.

### 2.2 Objectifs de sécurité

1. **Aucune prime encaissée ne peut être perdue, altérée ou comptée deux fois.**
2. **Aucune prime ne peut être détournée sans laisser une trace identifiant qui, quand et où.**
3. **Les données personnelles des assurés ne sont divulguées à personne hors du périmètre SUNU autorisé.**
4. **Un terminal volé ou une carte volée ne rapporte ni argent ni donnée personnelle exploitable.**
5. **Toute action sensible est imputable à une personne nommément identifiée.**
6. **Une défaillance de sécurité dégrade le service ; elle ne détruit pas l'enregistrement des encaissements.**
