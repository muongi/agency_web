function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html; return e}

function section(key,L){
  var s=el("div","sec");
  var h=el("div","sec-head");
  h.appendChild(el("h2",null,L.heads[key][0]));
  if(L.heads[key][1]) h.appendChild(el("span","note",L.heads[key][1]));
  s.appendChild(h);
  return s;
}

function dataTable(headers,rows){
  var card=el("div","card"); card.style.padding="0"; card.style.overflow="hidden";
  var wrap=el("div","scroll-x"); var t=document.createElement("table");
  var thead=document.createElement("thead"); var tr=document.createElement("tr");
  headers.forEach(function(h){var th=document.createElement("th"); th.textContent=h; tr.appendChild(th)});
  thead.appendChild(tr); t.appendChild(thead);
  var tb=document.createElement("tbody");
  rows.forEach(function(cells){
    var r=document.createElement("tr");
    cells.forEach(function(c){var td=document.createElement("td");
      if(c && c.html!==undefined){td.innerHTML=c.html; if(c.cls)td.className=c.cls}
      else {td.textContent=c===null?"":c}
      r.appendChild(td)});
    tb.appendChild(r)});
  t.appendChild(tb); wrap.appendChild(t); card.appendChild(wrap);
  return card;
}

function buildStatus(lg){
  var L=DATA[lg], root=document.getElementById("panel-status");
  root.innerHTML="";
  function fmt(t){return t.toLocaleDateString(L.loc,{day:"2-digit",month:"short"})}

  /* countdown strip lives in the masthead */
  var cEl=document.getElementById("counters"); cEl.innerHTML="";
  L.counters.forEach(function(c){
    var t=d(c[1]), n=daysTo(t), cls="ctr";
    if(n<0)cls+=" is-past"; else if(n<=14)cls+=" is-near";
    var v = n<0 ? L.past : (n===0 ? L.today : n+" "+(n===1?L.day:L.days));
    cEl.appendChild(el("div",cls,'<span class="lbl">'+c[0]+' · '+fmt(t)+
      '</span><span class="val">'+v+'</span>'));
  });

  root.appendChild(el("p","lede",L.lede));

  /* milestones */
  var s=section("ms",L), rail=el("ol","rail");
  L.ms.forEach(function(m){
    var li=el("li","ms"+(m[4]==="done"?" done":"")+(m[4]==="next"?" now":"")+(m[4]==="hard"?" hard":""));
    var chip = m[4]==="done" ? '<span class="chip ok">'+L.chip.done+'</span>'
             : m[4]==="next" ? '<span class="chip acc">'+L.chip.next+'</span>'
             : m[4]==="hard" ? '<span class="chip crit">'+L.chip.hard+'</span>' : "";
    li.innerHTML='<span class="pip"></span><div class="ms-top"><span class="ms-id">'+m[0]+
      '</span><span class="ms-date">'+m[1]+'</span>'+chip+
      '</div><span class="ms-title">'+m[2]+'</span><span class="ms-note">'+m[3]+'</span>';
    rail.appendChild(li);
  });
  s.appendChild(rail); root.appendChild(s);

  /* gates — the checkboxes keep index-based keys so ticks survive a language switch */
  s=section("gates",L);
  L.gates.forEach(function(g,gi){
    var c=el("div","card");
    var h='<div class="card-head"><span class="chip acc">'+g[0]+'</span><h3>'+g[2]+
          '</h3><span class="when">'+g[1]+'</span></div><ul class="checks">';
    g[3].forEach(function(it,i){
      var k=g[0]+":"+i, on=checks[k]?" checked":"";
      h+='<li><input type="checkbox" id="'+k+'" data-k="'+k+'"'+on+'><label for="'+k+'">'+it+'</label></li>';
    });
    c.innerHTML=h+"</ul>"; s.appendChild(c);
  });
  root.appendChild(s);

  /* dependencies */
  s=section("deps",L);
  s.appendChild(dataTable(L.th.deps, L.deps.map(function(r){
    var n=daysTo(d(r[2])), cls = n<0?"crit":(n<=7?"warn":"");
    return [{html:r[0],cls:"mono"}, r[1],
            {html:'<span class="chip '+cls+'">'+fmt(d(r[2]))+'</span>',cls:"mono"},
            r[3], {html:'<span style="color:var(--ink-3)">'+r[4]+'</span>'}];
  })));
  root.appendChild(s);

  /* open points */
  s=section("ops",L);
  s.appendChild(dataTable(L.th.ops, L.ops.map(function(r){
    return [{html:r[0],cls:"mono"}, r[1], {html:r[2],cls:"mono"},
            {html:'<span style="color:var(--ink-3)">'+r[3]+'</span>'}];
  })));
  root.appendChild(s);

  /* risks */
  s=section("risks",L);
  L.risks.forEach(function(r){
    var hi = r[2]==="high"||r[2]==="élevé";
    s.appendChild(el("div","card",
      '<div class="card-head"><span class="chip '+(hi?"crit":"warn")+'">'+r[2]+'</span>'+
      '<h3>'+r[1]+'</h3><span class="when">'+r[0]+' · '+r[4]+'</span></div>'+
      '<p style="margin:0;font-size:.9rem;color:var(--ink-2)">'+r[3]+'</p>'));
  });
  root.appendChild(s);

  /* hardening */
  s=section("hard",L);
  L.harden.forEach(function(h){
    var blocking=h[2]==="blocking";
    s.appendChild(el("div","card",
      '<div class="card-head"><span class="chip '+(blocking?"crit":"")+'">'+h[0]+'</span>'+
      '<h3>'+h[1]+'</h3><span class="when">'+(blocking?L.chip.blocking.toUpperCase()+" · ":"")+h[4]+'</span></div>'+
      '<p style="margin:0;font-size:.9rem;color:var(--ink-2)">'+h[3]+'</p>'));
  });
  root.appendChild(s);

  /* deliverables */
  s=section("del",L);
  s.appendChild(dataTable(L.th.del, L.delivs.map(function(r){
    var st = r[3]==="done" ? '<span class="chip ok">'+L.chip.delivered+'</span>'
                           : '<span class="chip">'+L.chip.pending+'</span>';
    return [{html:r[0],cls:"mono"}, r[1], {html:r[2],cls:"mono"}, {html:st}];
  })));
  root.appendChild(s);

  document.getElementById("totop").textContent=L.totop;
  document.getElementById("footnote").textContent=L.foot;
}

/* ---------- checkbox persistence ---------- */
document.addEventListener("change",function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-k");
  if(!k)return;
  if(e.target.checked)checks[k]=1; else delete checks[k];
  saveChecks(checks);
});

/* ---------- documents (bilingual, rendered on first view) ---------- */
marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});

var META={
 en:[{meta:"Overall and detailed architecture, including the SUNULIFE integration design · answers e-mail \u00a71 and \u00a72"},
     {meta:"Security architecture, procedures and controls · answers e-mail \u00a72"},
     {meta:"User guide for all six profiles · answers e-mail \u00a73"},
     {meta:"Deployment plan and schedule · answers e-mail \u00a75 and \u00a76"}],
 fr:[{meta:"Architecture globale et d\u00e9taill\u00e9e, y compris l\u2019int\u00e9gration SUNULIFE · r\u00e9pond au courriel \u00a71 et \u00a72"},
     {meta:"Architecture, proc\u00e9dures et dispositifs de s\u00e9curit\u00e9 · r\u00e9pond au courriel \u00a72"},
     {meta:"Guide utilisateur pour les six profils · r\u00e9pond au courriel \u00a73"},
     {meta:"Plan et calendrier de d\u00e9ploiement · r\u00e9pond au courriel \u00a75 et \u00a76"}]
};
var TOC_LABEL={en:"Contents",fr:"Sommaire"};
var TAB_LABEL={
 en:["Status","1 · Architecture","2 · Security","3 · User Guide","4 · Plan"],
 fr:["Suivi","1 · Architecture","2 · S\u00e9curit\u00e9","3 · Guide","4 · Plan"]
};

var LANGKEY="sunu-tpe-lang";
var lang="en";
try{var st=localStorage.getItem(LANGKEY); if(st==="fr"||st==="en")lang=st}catch(e){}
var rendered={};

function renderDoc(n,lg){
  var key="doc"+n+"-"+lg;
  if(rendered[key])return;
  var src=document.getElementById("src-"+key);
  if(!src)return;
  var panel=document.getElementById("panel-doc"+n);
  panel.innerHTML="";

  var meta=document.createElement("div");
  meta.className="doc-meta"; meta.textContent=META[lg][n-1].meta;

  var nav=document.createElement("details"); nav.className="doc-nav";
  nav.innerHTML='<summary>'+TOC_LABEL[lg]+'</summary><ol></ol>';

  var body=document.createElement("div"); body.className="prose";
  body.innerHTML=marked.parse(src.textContent);

  /* wide content scrolls inside its own box so the page never scrolls sideways */
  Array.prototype.forEach.call(body.querySelectorAll("table"),function(t){
    var w=document.createElement("div"); w.className="scroll-x";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  var ol=nav.querySelector("ol"), i=0;
  Array.prototype.forEach.call(body.querySelectorAll("h2,h3"),function(h){
    var id="d"+n+lg+"-h"+(i++); h.id=id;
    var li=document.createElement("li");
    if(h.tagName==="H3")li.className="sub";
    li.innerHTML='<a href="#'+id+'">'+h.textContent+"</a>";
    ol.appendChild(li);
  });

  panel.appendChild(meta); panel.appendChild(nav); panel.appendChild(body);
  rendered[key]=true;
}

function setLang(lg){
  lang=lg;
  try{localStorage.setItem(LANGKEY,lg)}catch(e){}
  document.getElementById("lang-en").setAttribute("aria-pressed",lg==="en"?"true":"false");
  document.getElementById("lang-fr").setAttribute("aria-pressed",lg==="fr"?"true":"false");
  document.documentElement.lang=lg;

  buildStatus(lg);

  rendered={};
  for(var n=1;n<=4;n++){
    document.getElementById("panel-doc"+n).innerHTML="";
    document.getElementById("tab-doc"+n).textContent=TAB_LABEL[lg][n];
  }
  document.getElementById("tab-status").textContent=TAB_LABEL[lg][0];

  var open=document.querySelector('.tab[aria-selected="true"]');
  if(open && /^tab-doc(\d)$/.test(open.id)) renderDoc(+RegExp.$1,lg);
}

document.getElementById("lang-en").addEventListener("click",function(){setLang("en")});
document.getElementById("lang-fr").addEventListener("click",function(){setLang("fr")});

/* ---------- tabs ---------- */
var tabs=Array.prototype.slice.call(document.querySelectorAll(".tab"));
function show(id){
  tabs.forEach(function(t){
    var on=t.id===id;
    t.setAttribute("aria-selected",on?"true":"false");
    document.getElementById(t.getAttribute("aria-controls")).hidden=!on;
  });
  window.scrollTo(0,0);
}
tabs.forEach(function(t){t.addEventListener("click",function(){
  if(/^tab-doc(\d)$/.test(t.id)) renderDoc(+RegExp.$1, lang);
  show(t.id);
})});
document.getElementById("totop").addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"})});

setLang(lang);
})();
</script>
