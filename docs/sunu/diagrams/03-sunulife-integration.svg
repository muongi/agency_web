<svg viewBox="0 0 820 590" role="img" aria-label="SUNULIFE integration: the pilot runs on a file extract and Excel export, while the API phases in afterwards without changing the rest of the design." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8B80"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker>
</defs>
<rect x="300" y="16" width="220" height="62" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="410" y="44" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">SUNULIFE</text>
<text x="410" y="60" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">master of customers and contracts</text>
<rect x="16" y="108" width="232" height="300" rx="8" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="26" y="124" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.95">PHASE 0 — pilot, September</text>
<rect x="32" y="140" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="165" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">CSV / XLSX extract</text>
<text x="132" y="181" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">one-off + periodic</text>
<line x1="300" y1="62" x2="132" y2="62" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<text x="216" y="54" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.8">manual extract</text>
<line x1="132" y1="62" x2="132" y2="140" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<rect x="32" y="244" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="269" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Bulk import</text>
<text x="132" y="285" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">existing customers visible</text>
<line x1="132" y1="196" x2="132" y2="244" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<rect x="32" y="330" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="355" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Excel export</text>
<text x="132" y="371" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">back office keys into SUNULIFE</text>
<text x="132" y="400" font-size="9.5" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.95">no API required</text>
<rect x="286" y="108" width="518" height="300" rx="8" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="296" y="124" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.95">PHASE 1 (read) · PHASE 2 (write)</text>
<rect x="306" y="140" width="200" height="60" rx="6" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="406" y="167" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Scheduled sync workers</text>
<text x="406" y="183" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">customer + policy delta, nightly</text>
<rect x="584" y="140" width="200" height="60" rx="6" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="684" y="167" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Outbound event queue</text>
<text x="684" y="183" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">collection posted · proposal</text>
<line x1="406" y1="78" x2="406" y2="140" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="398" y="98" font-size="9.5" font-weight="600" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.9">PULL</text>
<line x1="684" y1="140" x2="684" y2="78" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="692" y="98" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.9">PUSH</text>
<rect x="306" y="236" width="478" height="66" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="545" y="266" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">SUNULIFE ADAPTER</text>
<text x="545" y="282" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">auth strategy · field mapping · idempotency keys · circuit breaker · full request/response log</text>
<line x1="406" y1="200" x2="406" y2="236" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="684" y1="236" x2="684" y2="200" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="306" y="336" width="478" height="52" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="545" y="359" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Local mirror</text>
<text x="545" y="375" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">client + policy, mirrored — never authored here</text>
<line x1="545" y1="302" x2="545" y2="336" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<rect x="306" y="418" width="478" height="1" fill="currentColor" fill-opacity="0.2"/>
<text x="306" y="440" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.8">Retry on failure: 1m · 5m · 15m · 1h · 6h · 24h, then a manual review queue.</text>
<text x="306" y="456" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.8">A rejected push never reverses money already collected — it raises an exception.</text>
<rect x="16" y="430" width="232" height="52" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="453" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Collection continues</text>
<text x="132" y="469" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">SUNULIFE downtime is not a stoppage</text>
<text x="16" y="520" font-size="11" font-weight="700" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.95">The pilot date does not depend on the SUNULIFE API.</text>
<text x="16" y="538" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.82">Phase 0 meets SUNU's requirement that field agents see customers who already exist, using a periodic extract. If the API turns out</text>
<text x="16" y="552" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.82">not to exist, the same design runs on a scheduled SFTP file exchange — only the adapter changes, nothing else in the architecture.</text>
</svg>