<svg viewBox="0 0 820 590" role="img" aria-label="Intégration SUNULIFE : le pilote fonctionne sur une extraction de fichier et l’export Excel, l’API arrivant ensuite sans modifier le reste de la conception." xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
<marker id="ahT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8B80"/></marker>
<marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker>
</defs>
<rect x="300" y="16" width="220" height="62" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="410" y="44" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">SUNULIFE</text>
<text x="410" y="60" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">référentiel des clients et des contrats</text>
<rect x="16" y="108" width="232" height="300" rx="8" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="26" y="124" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.95">PHASE 0 — pilote, septembre</text>
<rect x="32" y="140" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="165" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Extraction CSV / XLSX</text>
<text x="132" y="181" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">initiale puis périodique</text>
<line x1="300" y1="62" x2="132" y2="62" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<text x="216" y="54" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.8">extraction manuelle</text>
<line x1="132" y1="62" x2="132" y2="140" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<rect x="32" y="244" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="269" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Import en masse</text>
<text x="132" y="285" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">clients existants visibles</text>
<line x1="132" y1="196" x2="132" y2="244" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ahT)"/>
<rect x="32" y="330" width="200" height="56" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="355" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Export Excel</text>
<text x="132" y="371" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">saisie back-office dans SUNULIFE</text>
<text x="132" y="400" font-size="9.5" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#0E8B80" fill-opacity="0.95">aucune API requise</text>
<rect x="286" y="108" width="518" height="300" rx="8" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="296" y="124" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.95">PHASE 1 (lecture) · PHASE 2 (écriture)</text>
<rect x="306" y="140" width="200" height="60" rx="6" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="406" y="167" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Synchronisation planifiée</text>
<text x="406" y="183" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">delta clients + polices, chaque nuit</text>
<rect x="584" y="140" width="200" height="60" rx="6" fill="#B8801C" fill-opacity="0.05" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="684" y="167" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">File d’événements sortants</text>
<text x="684" y="183" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">encaissement · proposition</text>
<line x1="406" y1="78" x2="406" y2="140" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="398" y="98" font-size="9.5" font-weight="600" text-anchor="end" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.9">LECTURE</text>
<line x1="684" y1="140" x2="684" y2="78" stroke="#B8801C" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 5"/>
<text x="692" y="98" font-size="9.5" font-weight="600" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#B8801C" fill-opacity="0.9">ÉCRITURE</text>
<rect x="306" y="236" width="478" height="66" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="545" y="266" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">ADAPTATEUR SUNULIFE</text>
<text x="545" y="282" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">authentification · mapping des champs · clés d’idempotence · coupe-circuit · journal complet</text>
<line x1="406" y1="200" x2="406" y2="236" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="684" y1="236" x2="684" y2="200" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="306" y="336" width="478" height="52" rx="6" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="545" y="359" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">Miroir local</text>
<text x="545" y="375" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">clients + polices, en miroir — jamais créés ici</text>
<line x1="545" y1="302" x2="545" y2="336" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4" marker-end="url(#ah)" marker-start="url(#ahs)"/>
<rect x="306" y="418" width="478" height="1" fill="currentColor" fill-opacity="0.2"/>
<text x="306" y="440" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.8">Reprise sur échec : 1 min · 5 min · 15 min · 1 h · 6 h · 24 h, puis file de revue manuelle.</text>
<text x="306" y="456" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.8">Un rejet n’annule jamais un encaissement déjà réalisé — il génère une anomalie.</text>
<rect x="16" y="430" width="232" height="52" rx="6" fill="#0E8B80" fill-opacity="0.05" stroke="#0E8B80" stroke-opacity="0.85" stroke-width="1.4"/>
<text x="132" y="453" font-size="13" font-weight="600" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="1">L’encaissement continue</text>
<text x="132" y="469" font-size="9.5" font-weight="400" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.72">une panne SUNULIFE n’arrête rien</text>
<text x="16" y="520" font-size="11" font-weight="700" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.95">L’échéance du pilote ne dépend pas de l’API SUNULIFE.</text>
<text x="16" y="538" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.82">La phase 0 répond à l’exigence de SUNU — que les agents voient les clients existants — au moyen d’une extraction périodique. Si l’API</text>
<text x="16" y="552" font-size="9.5" font-weight="400" text-anchor="start" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="currentColor" fill-opacity="0.82">n’existe pas, la même conception fonctionne par échange de fichiers SFTP planifié : seul l’adaptateur change, rien d’autre dans l’architecture.</text>
</svg>